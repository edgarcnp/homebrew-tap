name: Dispatch build

# Entry point for programmatic builds: a workflow_dispatch run names the app
# and feed version the API decided to build, plus the request id it minted.
# The API does not need the dispatch response's run id: the run itself posts an
# `accepted` report, and that is how the API binds the attempt to this run.
# Routing lives in the build workflow's plan job, so an unknown or missing app
# fails loudly instead of matching no job at all.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID minted by the API for this build request
        required: true
        type: string
      app:
        description: Tap descriptor id (a directory under packaging/apps)
        required: true
        type: string
      version:
        description: Feed version the API decided to build
        required: true
        type: string

permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      app: ${{ inputs.app }}
      request_id: ${{ inputs.request_id }}
      requested_version: ${{ inputs.version }}
