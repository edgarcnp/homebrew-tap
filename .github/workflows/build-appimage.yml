name: AppImage build

# Reusable pipeline for one app. Everything app specific (resolver, repository
# pins, staging, updater neutralization, debloat flags) comes from
# packaging/apps/<app>/app.json, so adding an app means adding a descriptor
# and a template directory - not a fork of this file.

on:
  workflow_call:
    inputs:
      app:
        description: App id; a directory under packaging/apps holding app.json (e.g. vscode)
        required: true
        type: string

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

concurrency:
  group: appimage-build-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      app_id: ${{ steps.app.outputs.id }}
      app_name: ${{ steps.app.outputs.name }}
      app_cask: ${{ steps.app.outputs.cask }}
      asset_prefix: ${{ steps.app.outputs.asset_prefix }}
      tag_prefix: ${{ steps.app.outputs.tag_prefix }}
      needs_webkit: ${{ steps.app.outputs.needs_webkit }}
      architectures: ${{ steps.app.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.resolve.outputs.version }}
      skipped: ${{ steps.gate.outputs.skipped }}
      repair_cask: ${{ steps.gate.outputs.repair_cask }}
      source: ${{ steps.source.outputs.repo }}
      upstream_sha256_amd64: ${{ steps.resolve.outputs.upstream_sha256_amd64 }}
      upstream_sha256_arm64: ${{ steps.resolve.outputs.upstream_sha256_arm64 }}
      upstream_url_amd64: ${{ steps.resolve.outputs.upstream_url_amd64 }}
      upstream_url_arm64: ${{ steps.resolve.outputs.upstream_url_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Load app descriptor
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          # descriptor-env validates the descriptor and emits the pipeline's
          # variables: uppercase for shell steps ($GITHUB_ENV) and lowercase
          # for job outputs, which cannot read the env context.
          bun tap/packaging/bin/fbr.ts descriptor-env --app "${APP}" >> "${GITHUB_ENV}"
          bun tap/packaging/bin/fbr.ts descriptor-env --app "${APP}" --format output >> "${GITHUB_OUTPUT}"
      - name: Plan the build matrix
        id: matrix
        run: |
          # Single-arch apps (e.g. CommandCode, amd64-only upstream) build one
          # AppImage; dual-arch apps build both. The matrix is derived from the
          # descriptor so adding a single-arch app needs no workflow edit.
          matrix="$(jq -c '{include: [.[] | select(. == "amd64" or . == "arm64") | if . == "amd64" then {architecture: ., runner: "ubuntu-latest", appimage_arch: "x86_64"} else {architecture: ., runner: "ubuntu-24.04-arm", appimage_arch: "aarch64"} end]}' <<<"${APP_ARCHITECTURES}")"
          [ "$(jq '.include | length' <<<"${matrix}")" -gt 0 ] || { echo "::error::no supported architectures in ${APP_ARCHITECTURES}" >&2; exit 1; }
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
      - name: Select source repository
        id: source
        run: |
          # Build from the upstream repository when it is reachable; otherwise
          # fall back to this owner's fork of it.
          upstream="${SOURCE_REPO}"
          if git ls-remote --exit-code "https://github.com/${upstream}.git" HEAD >/dev/null 2>&1; then
            echo "repo=${upstream}" >> "${GITHUB_OUTPUT}"
          else
            echo "repo=${SOURCE_OWNER}/${upstream#*/}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repo }}
          path: source
          persist-credentials: false
      - name: Resolve upstream version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the apt resolver verifies a signed index with gpg.
          if [[ "$(bun source/packaging/bin/fbr.ts descriptor --app "${APP_ID}" --field oracle.kind)" == "apt" ]]; then
            sudo apt-get update
            sudo apt-get install -y gnupg
          fi
          cd source
          version=""
          upstream_sha256_amd64=""
          upstream_sha256_arm64=""
          upstream_url_amd64=""
          upstream_url_arm64=""
          while IFS= read -r arch; do
            [ -n "${arch}" ] || continue
            file="upstream/metadata-${arch}.json"
            bun packaging/bin/fbr.ts resolve \
              --app "${APP_ID}" --arch "${arch}" --metadata-only \
              --output-dir upstream --metadata "${file}"
            arch_version="$(jq -r '.version' "${file}")"
            if [ -z "${version}" ]; then
              version="${arch_version}"
            elif [ "${version}" != "${arch_version}" ]; then
              echo "upstream version mismatch: ${version} vs ${arch_version} (${arch})" >&2
              exit 1
            fi
            sha="$(jq -r '.sha256' "${file}")"
            url="$(jq -r '.repository + "/" + .repositoryPath' "${file}")"
            case "${arch}" in
              amd64)
                upstream_sha256_amd64="${sha}"
                upstream_url_amd64="${url}"
                ;;
              arm64)
                upstream_sha256_arm64="${sha}"
                upstream_url_arm64="${url}"
                ;;
              *) echo "unsupported architecture: ${arch}" >&2; exit 1 ;;
            esac
          done < <(jq -r '.[]' <<<"${APP_ARCHITECTURES}")
          [ -n "${version}" ] || { echo "no architectures resolved" >&2; exit 1; }
          [[ "${version}" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid upstream version: ${version}" >&2; exit 1; }
          version="${version//[^0-9A-Za-z._-]/_}"
          {
            echo "upstream_sha256_amd64=${upstream_sha256_amd64}"
            echo "upstream_sha256_arm64=${upstream_sha256_arm64}"
            echo "upstream_url_amd64=${upstream_url_amd64}"
            echo "upstream_url_arm64=${upstream_url_arm64}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
      - name: Gate on upstream version vs cask version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The gate decision itself is a unit-tested pure function; this step
          # only gathers its inputs (cask pin, release existence, and whether
          # the published assets still match the cask's checksums - DWARFS
          # images are not byte reproducible, so a rebuild can change them
          # without a version bump).
          cask_json="$(bun tap/packaging/bin/fbr.ts cask --action read --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap")"
          cask_version="$(jq -r '.version' <<<"${cask_json}")"
          version="${{ steps.resolve.outputs.version }}"

          release_exists=false
          if gh release view "${TAG_PREFIX}${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_exists=true
          fi

          matches=""
          if [[ "${release_exists}" = "true" && "${cask_version}" = "${version}" ]]; then
            tmp_dir="$(mktemp -d)"
            if timeout 60 gh release download "${TAG_PREFIX}${version}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${ASSET_PREFIX}-*-x86_64.AppImage" \
              --pattern "${ASSET_PREFIX}-*-aarch64.AppImage" \
              --dir "${tmp_dir}" --clobber
            then
              shopt -s nullglob
              x86_files=("${tmp_dir}/${ASSET_PREFIX}"-*-x86_64.AppImage)
              arm_files=("${tmp_dir}/${ASSET_PREFIX}"-*-aarch64.AppImage)
              # Single-arch apps publish one AppImage; compare only the
              # architectures the descriptor ships. A missing expected asset
              # leaves matches empty (could not compare); a hash mismatch
              # sets it to false.
              incomparable=false
              amd64_ok=true
              arm64_ok=true
              if [[ "${APP_ARCHITECTURES}" == *amd64* ]]; then
                if [[ "${#x86_files[@]}" -ne 1 ]]; then
                  echo "expected exactly one x86_64 asset in release ${TAG_PREFIX}${version}" >&2
                  incomparable=true
                elif [[ "$(sha256sum "${x86_files[0]}" | awk '{print $1}')" != "$(jq -r '.sha256.amd64' <<<"${cask_json}")" ]]; then
                  amd64_ok=false
                fi
              fi
              if [[ "${APP_ARCHITECTURES}" == *arm64* ]]; then
                if [[ "${#arm_files[@]}" -ne 1 ]]; then
                  echo "expected exactly one aarch64 asset in release ${TAG_PREFIX}${version}" >&2
                  incomparable=true
                elif [[ "$(sha256sum "${arm_files[0]}" | awk '{print $1}')" != "$(jq -r '.sha256.arm64' <<<"${cask_json}")" ]]; then
                  arm64_ok=false
                fi
              fi
              if [[ "${incomparable}" = "false" ]]; then
                matches=false
                if [[ "${amd64_ok}" = "true" && "${arm64_ok}" = "true" ]]; then
                  matches=true
                fi
              fi
            else
              echo "failed to download release ${TAG_PREFIX}${version}" >&2
            fi
            rm -rf -- "${tmp_dir}"
          fi

          if [[ "${release_exists}" = "true" && "${cask_version}" != "${version}" ]]; then
            # A queued duplicate run may have been queued against a stale
            # branch; re-read the cask from origin/main before deciding.
            if git -C tap fetch --quiet origin main; then
              git -C tap reset --hard --quiet FETCH_HEAD
              cask_version="$(bun tap/packaging/bin/fbr.ts cask --action read --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" | jq -r '.version')"
            fi
          fi

          gate_args=(--app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" --upstream-version "${version}")
          if [[ "${release_exists}" = "true" ]]; then
            gate_args+=(--release-exists)
          fi
          if [[ -n "${matches}" ]]; then
            gate_args+=(--release-matches-cask "${matches}")
          fi
          bun tap/packaging/bin/fbr.ts gate "${gate_args[@]}" | tee -a "${GITHUB_OUTPUT}"

  build:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    # Builds run inside pkgforge's Arch Linux container: AppImages are built
    # with sharun/quick-sharun, which bundle the app + libc + everything else
    # from the build system, so the build OS must be Arch for correct 32-bit
    # lib layout and access to pkgforge's debloated packages via pacman.
    # Pinned image tag; pacman -Syu runs on every build anyway.
    container:
      image: ghcr.io/pkgforge-dev/archlinux:v2026.09.05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect.outputs.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - name: Prepare Arch container
        run: |
          # Bun is set up only after this step: setup-bun extracts its download
          # with unzip, which this step installs. The rest of the toolchain the
          # pipeline shells out to (jq, dpkg, curl, ...) is installed here too.
          pacman-key --init
          pacman -Syy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            7zip \
            base-devel \
            curl \
            dpkg \
            git \
            gnupg \
            jq \
            nss \
            patchelf \
            unzip \
            wget \
            xorg-server-xvfb \
            zsync
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Load app descriptor
        env:
          APP: ${{ inputs.app }}
        run: |
          # The tap is the pipeline's source of truth for the build flags; the
          # build script itself reads the descriptor from the source checkout.
          bun "${GITHUB_WORKSPACE}/tap/packaging/bin/fbr.ts" descriptor-env --app "${APP}" >> "${GITHUB_ENV}"
      - name: Install webkit2gtk build dependencies
        if: needs.detect.outputs.needs_webkit == 'true'
        run: |
          # webkit2gtk runtime closure for the gitbutler AppImage build;
          # sharun bundles these libs into the AppImage from this system
          pacman -S --noconfirm \
            gdk-pixbuf2 \
            glib-networking \
            gtk3 \
            webkit2gtk-4.1
      - name: Install appimagetool
        run: |
          # Renovate owns the 0.5.0 version below (renovate.json
          # customManagers); it cannot recompute the per-arch hashes, so update
          # them in the same PR - the check prints the hash it measured.
          # Hashes come from the pkgforge 0.5.0 release assets. This is the
          # plain (non -full) build: it downloads uruntime/mkdwarfs at build
          # time and verifies them against its own pinned digests, exactly as
          # the 0.4.2 build it replaces did.
          # quick-sharun's pinned commit still defaults to 0.4.2 with matching
          # hashes, but the APPIMAGETOOL override below means its copy is never
          # downloaded or used.
          # quick-sharun invokes this binary via the APPIMAGETOOL env var with
          # no CLI args; it reads APPDIR/OUTPATH/OUTNAME/ARCH/VERSION from the
          # environment.
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/appimagetool-uruntime \
            "https://github.com/pkgforge-dev/appimagetool/releases/download/0.5.0/appimagetool-${{ matrix.appimage_arch }}-linux"
          test -s /tmp/appimagetool-uruntime
          case "${{ matrix.appimage_arch }}" in
            x86_64) expected="0557ee3b0451a150d1c32c23a8038c23d527dcde6e8c10af72e24e066b41770c" ;;
            aarch64) expected="9411822729ef3601197ae40a06c5fb3e1fa9d681938fe0ed9813dbb07c36ba6d" ;;
            *) echo "Unknown appimage_arch: ${{ matrix.appimage_arch }}" >&2; exit 1 ;;
          esac
          actual="$(sha256sum /tmp/appimagetool-uruntime | awk '{print $1}')"
          if [ "${actual}" != "${expected}" ]
          then
            echo "::error::appimagetool ${{ matrix.appimage_arch }} hashes to ${actual}, not ${expected}" >&2
            exit 1
          fi
          chmod +x /tmp/appimagetool-uruntime
          mv /tmp/appimagetool-uruntime /opt/appimagetool-uruntime
      - name: Install Anylinux build tools
        run: |
          # quick-sharun + get-debloated-pkgs, pinned to a commit of
          # pkgforge-dev/Anylinux-AppImages and SHA-256 verified; bumps are
          # manual PRs (see packaging/scripts/install-anylinux-tools.sh)
          "${GITHUB_WORKSPACE}/tap/packaging/scripts/install-anylinux-tools.sh"
      - name: Install debloated packages
        run: |
          # Debloated Arch packages (mesa without LLVM, stripped libicudata,
          # ffmpeg-mini, etc.) shrink the final AppImages; per-app flags come
          # from the app descriptor.
          read -r -a flags <<<"${DEBLOAT_ARGS}"
          get-debloated-pkgs "${flags[@]}"
      - name: Build AppImage
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          # quick-sharun drives the pkgforge appimagetool via env vars,
          # not CLI args
          APPIMAGETOOL: /opt/appimagetool-uruntime
          # brew owns updates, so no AppImage self-update information ships.
          # quick-sharun treats an empty UPINFO as "guess it from
          # GITHUB_REPOSITORY" (quick-sharun.sh, pinned commit), but the guess
          # does not reach the AppImage: published artifacts carry an empty
          # .upd_info section and no zsync string.
          UPINFO: ""
        run: |
          cd source
          [ -z "${SOURCE_DIR}" ] || cd "${SOURCE_DIR}"
          bash -c "${BUILD_COMMAND}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.detect.outputs.asset_prefix }}-${{ matrix.appimage_arch }}
          path: source/dist/${{ needs.detect.outputs.asset_prefix }}-${{ needs.detect.outputs.version }}-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # Release retention sorts tags with the pipeline's own dpkg ordering, so
      # this job needs the tap and the CLI (unlike the release steps, which
      # only need gh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.detect.outputs.asset_prefix }}-*
          merge-multiple: true
          path: assets
      - name: Generate release notes
        id: notes
        env:
          UPSTREAM_SHA_AMD64: ${{ needs.detect.outputs.upstream_sha256_amd64 }}
          UPSTREAM_SHA_ARM64: ${{ needs.detect.outputs.upstream_sha256_arm64 }}
          UPSTREAM_URL_AMD64: ${{ needs.detect.outputs.upstream_url_amd64 }}
          UPSTREAM_URL_ARM64: ${{ needs.detect.outputs.upstream_url_arm64 }}
          APP_CASK: ${{ needs.detect.outputs.app_cask }}
          ASSET_PREFIX: ${{ needs.detect.outputs.asset_prefix }}
        run: |
          # shellcheck disable=SC2016 # printf format strings and GitHub Actions templates are intentional
          {
            printf '%s\n\n' '## Artifact checksums'
            printf 'Upstream package integrity is verified against the release source (signed APT index or download-time SHA-256) before packaging; the AppImage hashes are enforced by the `%s` cask at install.\n' "${APP_CASK}"
            printf '\n'
            printf '%s\n' '| Artifact | SHA-256 |'
            printf '%s\n' '| --- | --- |'
            printf '| Upstream package (amd64) | `%s` |\n' "${UPSTREAM_SHA_AMD64:-n/a}"
            if [ -n "${UPSTREAM_SHA_ARM64}" ]; then
              printf '| Upstream package (arm64) | `%s` |\n' "${UPSTREAM_SHA_ARM64}"
            fi
            for file in assets/"${ASSET_PREFIX}"-*.AppImage; do
              [ -e "$file" ] || continue
              arch="${file##*-}"
              arch="${arch%.AppImage}"
              printf '| AppImage (%s) | `%s` |\n' "$arch" "$(sha256sum "$file" | awk '{print $1}')"
            done
            printf '\n'
            printf '%s\n' '### Sources'
            printf -- '- Upstream package (amd64): %s\n' "$UPSTREAM_URL_AMD64"
            if [ -n "${UPSTREAM_URL_ARM64}" ]; then
              printf -- '- Upstream package (arm64): %s\n' "$UPSTREAM_URL_ARM64"
            fi
          } > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          APP_NAME: ${{ needs.detect.outputs.app_name }}
          ASSET_PREFIX: ${{ needs.detect.outputs.asset_prefix }}
        run: |
          TAG="${TAG_PREFIX}${PACKAGE_VERSION}"
          shopt -s nullglob
          appimages=(assets/"${ASSET_PREFIX}"-*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "::error::no AppImage artifacts matched assets/${ASSET_PREFIX}-*.AppImage" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${APP_NAME} ${PACKAGE_VERSION}" \
            --notes-file release-notes.md \
            "${appimages[@]}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/${{ needs.detect.outputs.asset_prefix }}-*.AppImage

      - name: Retain only the 3 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
        run: |
          # "Newest" is the pipeline's dpkg ordering, not `sort -V`: for shapes
          # upstreams publish (1.0.109a vs 1.0.109-1, 1.0+build vs 1.0-rc.1)
          # GNU's version sort and dpkg disagree about which is newer, and
          # pruning must never drop the newest release. A failing gh call or an
          # unparseable tag fails this step instead of pruning a short list.
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName')"

          versions=()
          while IFS= read -r tag
          do
            [ -n "${tag}" ] || continue
            stripped="${tag#"${TAG_PREFIX}"}"
            [ "${stripped}" != "${tag}" ] || continue
            [ -n "${stripped}" ] || { echo "::error::release tag ${tag} has an empty version" >&2; exit 1; }
            versions+=("${stripped}")
          done <<< "${tags}"

          keep=3
          if [ "${#versions[@]}" -le "${keep}" ]; then
            printf 'retaining %s release(s); nothing stale\n' "${#versions[@]}"
            exit 0
          fi

          ordered="$(bun tap/packaging/bin/fbr.ts version-compare --sort "${versions[@]}")"
          [ -n "${ordered}" ] || { echo "::error::version-compare --sort produced no output" >&2; exit 1; }
          mapfile -t sorted <<< "${ordered}"

          stale=("${sorted[@]:0:$((${#sorted[@]} - keep))}")
          printf 'retaining %s release(s); deleting %s stale release(s)\n' "${keep}" "${#stale[@]}"
          for version in "${stale[@]}"
          do
            printf 'deleting release %s%s\n' "${TAG_PREFIX}" "${version}"
            gh release delete "${TAG_PREFIX}${version}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

  update-cask:
    needs: [detect, publish]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: push-casks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Pin cask to published release
        uses: ./.github/actions/update-cask
        with:
          app: ${{ needs.detect.outputs.app_id }}
          package_version: ${{ needs.detect.outputs.version }}
          tag_prefix: ${{ needs.detect.outputs.tag_prefix }}
          asset_prefix: ${{ needs.detect.outputs.asset_prefix }}
          token: ${{ secrets.HOMEBREW_PAT }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

  repair-cask:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: push-casks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Pin cask to published release
        uses: ./.github/actions/update-cask
        with:
          app: ${{ needs.detect.outputs.app_id }}
          package_version: ${{ needs.detect.outputs.version }}
          tag_prefix: ${{ needs.detect.outputs.tag_prefix }}
          asset_prefix: ${{ needs.detect.outputs.asset_prefix }}
          token: ${{ secrets.HOMEBREW_PAT }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
