name: AppImage build

on:
  workflow_call:
    inputs:
      app_cask:
        description: Cask filename stem this pipeline updates (e.g. my-app)
        required: true
        type: string
      app_name:
        description: Human-readable app name used in the release title (e.g. My App)
        required: true
        type: string
      asset_prefix:
        description: Release asset filename prefix (e.g. my-app)
        required: true
        type: string
      tag_prefix:
        description: Release tag prefix, including trailing dash (e.g. my-app-v)
        required: true
        type: string
      source_owner:
        description: Owner of the fallback fork, used only when upstream_repo is unreachable (e.g. myorg)
        required: true
        type: string
      upstream_repo:
        description: Upstream packaging repository (owner/repo) to build from when available (e.g. myorg/my-app-linux)
        required: true
        type: string

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skipped: ${{ steps.gate.outputs.skipped }}
      source: ${{ steps.source.outputs.repo }}
      upstream_sha256_amd64: ${{ steps.resolve.outputs.upstream_sha256_amd64 }}
      upstream_sha256_arm64: ${{ steps.resolve.outputs.upstream_sha256_arm64 }}
      upstream_url_amd64: ${{ steps.resolve.outputs.upstream_url_amd64 }}
      upstream_url_arm64: ${{ steps.resolve.outputs.upstream_url_arm64 }}
      cask_version: ${{ steps.gate.outputs.cask_version }}
      repair_cask: ${{ steps.gate.outputs.repair_cask }}
    steps:
      - name: Select source repository
        id: source
        env:
          SOURCE_REPO_OWNER: ${{ inputs.source_owner }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        run: |
          UPSTREAM_REPO_NAME="${UPSTREAM_REPO#*/}"
          if git ls-remote --exit-code "https://github.com/${UPSTREAM_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "repo=${UPSTREAM_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${SOURCE_REPO_OWNER}/${UPSTREAM_REPO_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.source.outputs.repo }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Resolve upstream version from signed repository
        id: resolve
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
          cd source
          node scripts/lib/upstream-linux-package.js \
            --metadata-only \
            --output-dir upstream \
            --metadata upstream/metadata.json \
            --key-base64 assets/openai-codex-linux-repository-key.gpg.base64 \
            --arch amd64
          node scripts/lib/upstream-linux-package.js \
            --metadata-only \
            --output-dir upstream \
            --metadata upstream/metadata-arm64.json \
            --key-base64 assets/openai-codex-linux-repository-key.gpg.base64 \
            --arch arm64
          amd64_metadata="upstream/metadata.json"
          arm64_metadata="upstream/metadata-arm64.json"
          version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$amd64_metadata")"
          arm64_version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$arm64_metadata")"
          [ "$version" = "$arm64_version" ] || { echo "amd64/arm64 upstream version mismatch" >&2; exit 1; }
          echo "upstream_sha256_amd64=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sha256' "$amd64_metadata")" >> "$GITHUB_OUTPUT"
          echo "upstream_sha256_arm64=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sha256' "$arm64_metadata")" >> "$GITHUB_OUTPUT"
          echo "upstream_url_amd64=$(node -p 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); m.repository + "/" + m.repositoryPath' "$amd64_metadata")" >> "$GITHUB_OUTPUT"
          echo "upstream_url_arm64=$(node -p 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); m.repository + "/" + m.repositoryPath' "$arm64_metadata")" >> "$GITHUB_OUTPUT"
          version="${version//[^0-9A-Za-z._-]/_}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tap
          persist-credentials: false
      - name: Gate on upstream version vs cask version
        id: gate
        run: |
          cask_version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' "tap/Casks/${{ inputs.app_cask }}.rb" | head -n1)"
          version="${{ steps.resolve.outputs.version }}"
          newer="false"
          case "$cask_version" in
            ''|[!0-9]*)
              newer="true" ;;
            *)
              if printf '%s\n%s\n' "$cask_version" "$version" | sort -V -C; then
                if [ "$cask_version" != "$version" ]; then
                  newer="true"
                fi
              fi ;;
          esac
          release_exists="false"
          if gh release view "${{ inputs.tag_prefix }}${version}" >/dev/null 2>&1; then
            release_exists="true"
          fi
          skipped="false"
          repair="false"
          if [ "$newer" = "true" ]; then
            if [ "$release_exists" = "true" ]; then
              echo "Upstream ${version} is newer than cask ${cask_version}; release already published, catching cask up"
              repair="true"
            else
              echo "Upstream ${version} is newer than cask ${cask_version}; building"
            fi
          else
            if [ "$release_exists" = "true" ]; then
              echo "Cask ${cask_version} already at or above upstream ${version}; skipping"
              skipped="true"
            else
              echo "Cask ${cask_version} references a version with no release; (re)building"
            fi
          fi
          echo "cask_version=${cask_version}" >> "$GITHUB_OUTPUT"
          echo "newer=${newer}" >> "$GITHUB_OUTPUT"
          echo "release_exists=${release_exists}" >> "$GITHUB_OUTPUT"
          echo "repair_cask=${repair}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            appimage_arch: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.detect.outputs.source }}
          path: source
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg rpm
      - name: Install appimagetool
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          test -s /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract >/dev/null)
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          CODEX_TARGET_ARCH: ${{ matrix.architecture }}
          PACKAGE_WITH_UPDATER: "0"
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          cd source
          ./install.sh
          ./scripts/build-appimage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.asset_prefix }}-${{ matrix.appimage_arch }}
          path: source/dist/${{ inputs.asset_prefix }}-${{ needs.detect.outputs.version }}-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.asset_prefix }}-*
          merge-multiple: true
          path: assets
      - name: Generate release notes
        id: notes
        env:
          UPSTREAM_SHA_AMD64: ${{ needs.detect.outputs.upstream_sha256_amd64 }}
          UPSTREAM_SHA_ARM64: ${{ needs.detect.outputs.upstream_sha256_arm64 }}
          UPSTREAM_URL_AMD64: ${{ needs.detect.outputs.upstream_url_amd64 }}
          UPSTREAM_URL_ARM64: ${{ needs.detect.outputs.upstream_url_arm64 }}
        run: |
          {
            printf '%s\n\n' '## Artifact checksums'
            printf '%s\n' 'Upstream `.deb` hashes come from the signed APT index; the AppImage hashes are enforced by the `${{ inputs.app_cask }}` cask at install.'
            printf '\n'
            printf '%s\n' '| Artifact | SHA-256 |'
            printf '%s\n' '| --- | --- |'
            printf '| Upstream `.deb` (amd64) | `%s` |\n' "$UPSTREAM_SHA_AMD64"
            printf '| Upstream `.deb` (arm64) | `%s` |\n' "$UPSTREAM_SHA_ARM64"
            for file in assets/${{ inputs.asset_prefix }}-*.AppImage; do
              [ -e "$file" ] || continue
              arch="${file##*-}"
              arch="${arch%.AppImage}"
              printf '| AppImage (%s) | `%s` |\n' "$arch" "$(sha256sum "$file" | awk '{print $1}')"
            done
            printf '\n'
            printf '%s\n' '### Sources'
            printf -- '- Upstream `.deb` (amd64): %s\n' "$UPSTREAM_URL_AMD64"
            printf -- '- Upstream `.deb` (arm64): %s\n' "$UPSTREAM_URL_ARM64"
          } > release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag_prefix }}${{ needs.detect.outputs.version }}
          name: ${{ inputs.app_name }} ${{ needs.detect.outputs.version }}
          body_path: release-notes.md
          files: assets/${{ inputs.asset_prefix }}-*.AppImage
          fail_on_unmatched_files: true

  update-cask:
    needs: [detect, publish]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.asset_prefix }}-*
          merge-multiple: true
          path: assets
      - name: Update cask version and checksums
        env:
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          x86_64_sha="$(sha256sum assets/${{ inputs.asset_prefix }}-*-x86_64.AppImage | awk '{print $1}')"
          arm64_sha="$(sha256sum assets/${{ inputs.asset_prefix }}-*-aarch64.AppImage | awk '{print $1}')"
          python3 - "$PACKAGE_VERSION" "$x86_64_sha" "$arm64_sha" <<'PY'
          import re
          import sys

          version, x64, arm = sys.argv[1], sys.argv[2], sys.argv[3]
          path = "Casks/${{ inputs.app_cask }}.rb"
          text = open(path, encoding="utf-8").read()
          text = re.sub(r'^\s*version "[^"]*"', f'  version "{version}"', text, count=1, flags=re.M)
          text = re.sub(r'(x86_64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{x64}\g<2>", text, count=1)
          text = re.sub(r'(arm64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{arm}\g<2>", text, count=1)
          open(path, "w", encoding="utf-8").write(text)
          PY
          if git diff --quiet -- "Casks/${{ inputs.app_cask }}.rb"; then
            echo "Cask already up to date; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${{ inputs.app_cask }}.rb"
          git commit -m "chore(cask): update ${{ inputs.app_cask }} to $PACKAGE_VERSION"
      - name: Push cask update
        uses: Homebrew/actions/git-try-push@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          branch: main

  repair-cask:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Catch cask up to existing release
        env:
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          gh release download "${{ inputs.tag_prefix }}$PACKAGE_VERSION" \
            --pattern "${{ inputs.asset_prefix }}-*-x86_64.AppImage" \
            --pattern "${{ inputs.asset_prefix }}-*-aarch64.AppImage" \
            --dir assets --clobber
          x86_64_sha="$(sha256sum assets/${{ inputs.asset_prefix }}-*-x86_64.AppImage | awk '{print $1}')"
          arm64_sha="$(sha256sum assets/${{ inputs.asset_prefix }}-*-aarch64.AppImage | awk '{print $1}')"
          python3 - "$PACKAGE_VERSION" "$x86_64_sha" "$arm64_sha" <<'PY'
          import re
          import sys

          version, x64, arm = sys.argv[1], sys.argv[2], sys.argv[3]
          path = "Casks/${{ inputs.app_cask }}.rb"
          text = open(path, encoding="utf-8").read()
          text = re.sub(r'^\s*version "[^"]*"', f'  version "{version}"', text, count=1, flags=re.M)
          text = re.sub(r'(x86_64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{x64}\g<2>", text, count=1)
          text = re.sub(r'(arm64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{arm}\g<2>", text, count=1)
          open(path, "w", encoding="utf-8").write(text)
          PY
          if git diff --quiet -- "Casks/${{ inputs.app_cask }}.rb"; then
            echo "Cask already up to date; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${{ inputs.app_cask }}.rb"
          git commit -m "chore(cask): update ${{ inputs.app_cask }} to $PACKAGE_VERSION"
      - name: Push cask update
        uses: Homebrew/actions/git-try-push@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          branch: main