name: Build and publish Visual Studio Code AppImage

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

concurrency:
  group: vscode-build
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.app == 'vscode'
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build-appimage.yml
    secrets: inherit
    with:
      app_cask: vscode
      app_name: Visual Studio Code
      asset_prefix: vscode
      tag_prefix: vscode-v
      source_owner: edgarcnp
      upstream_repo: edgarcnp/homebrew-tap
      repository_url: https://packages.microsoft.com/repos/code
      key_path: packaging/vscode/assets/microsoft-vscode-repository-key.gpg.base64
      resolve_script: packaging/lib/upstream-linux-package.js
      resolve_args: --package code --fingerprint BC528686B50D79E339D3721CEB3E94ADBE1229CF
      source_dir: packaging/vscode
      build_command: ./scripts/build-appimage.sh
