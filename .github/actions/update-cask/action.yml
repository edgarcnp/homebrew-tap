name: Pin cask to published release
description: >-
  Verify a release was published by this pipeline's own bot account as a final
  (non-draft, non-prerelease) release, download its AppImage assets, update the
  cask's version and SHA-256 stanzas, then commit and push the change with
  rebase-on-conflict retry. Shared by the update-cask and repair-cask jobs so
  the release-trust check and the push logic live in one place.
inputs:
  package_version:
    description: Upstream version to pin into the cask
    required: true
  tag_prefix:
    description: Release tag prefix, including trailing dash (e.g. my-app-v)
    required: true
  asset_prefix:
    description: Release asset filename prefix (e.g. my-app)
    required: true
  app_cask:
    description: Cask filename stem to update (e.g. my-app)
    required: true
  token:
    description: GitHub token with contents:write on the default branch
    required: true
runs:
  using: composite
  steps:
    - name: Update cask version and checksums
      shell: bash -xeuo pipefail {0}
      env:
        PACKAGE_VERSION: ${{ inputs.package_version }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        ASSET_PREFIX: ${{ inputs.asset_prefix }}
        APP_CASK: ${{ inputs.app_cask }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        [[ "$PACKAGE_VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid version: $PACKAGE_VERSION" >&2; exit 1; }
        # Only trust release assets from a release this pipeline's own bot
        # account published as a final (non-draft, non-prerelease) release;
        # assets re-uploaded by anyone with contents:write have no
        # provenance and must never be pinned into the cask.
        release_meta="$(gh release view "${TAG_PREFIX}${PACKAGE_VERSION}" \
          --repo "$GITHUB_REPOSITORY" --json author,isDraft,isPrerelease \
          --jq '[.author.login, (.isDraft|tostring), (.isPrerelease|tostring)] | join(" ")')"
        read -r release_author release_draft release_prerelease <<<"${release_meta}"
        if [[ "${release_author}" != "github-actions[bot]" \
          || "${release_draft}" == "true" \
          || "${release_prerelease}" == "true" ]]; then
          echo "warning: release ${TAG_PREFIX}${PACKAGE_VERSION} (author=${release_author}, draft=${release_draft}, prerelease=${release_prerelease}) is not a trusted bot release; not pinning cask, rebuild required" >&2
          exit 1
        fi
        # hash the released assets, not the run artifacts, so the cask
        # always matches what the release actually hosts
        gh release download "${TAG_PREFIX}${PACKAGE_VERSION}" \
          --repo "$GITHUB_REPOSITORY" \
          --pattern "${ASSET_PREFIX}-*-x86_64.AppImage" \
          --pattern "${ASSET_PREFIX}-*-aarch64.AppImage" \
          --dir assets --clobber
        x86_64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-x86_64.AppImage | awk '{print $1}')"
        arm64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-aarch64.AppImage | awk '{print $1}')"
        python3 - "$PACKAGE_VERSION" "$x86_64_sha" "$arm64_sha" <<'PY'
        import os
        import re
        import sys

        version, x64, arm = sys.argv[1], sys.argv[2], sys.argv[3]
        path = f"Casks/{os.environ['APP_CASK']}.rb"
        text = open(path, encoding="utf-8").read()
        text, n = re.subn(r'^(\s*)version "[^"]*"', rf'\1version "{version}"', text, count=1, flags=re.M)
        if n != 1:
            print(f"no cask version pattern found in {path}", file=sys.stderr)
            sys.exit(1)
        text, n = re.subn(r'(x86_64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{x64}\g<2>", text, count=1)
        if n != 1:
            print(f"no x86_64_linux sha256 pattern found in {path}", file=sys.stderr)
            sys.exit(1)
        text, n = re.subn(r'(arm64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{arm}\g<2>", text, count=1)
        if n != 1:
            print(f"no arm64_linux sha256 pattern found in {path}", file=sys.stderr)
            sys.exit(1)
        open(path, "w", encoding="utf-8").write(text)
        PY
    - name: Import GPG signing key
      id: import-gpg
      shell: bash -xeuo pipefail {0}
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
        uid="$(gpg --list-secret-keys --keyid-format=long | awk '/^uid/ {print; exit}')"
        key_id="$(gpg --list-secret-keys --keyid-format=long | awk '/^sec/ {print $2; exit}' | cut -d/ -f2)"
        name="$(sed -E 's/^uid\s+\[[^]]*\]\s+//; s/\s*<[^>]+>\s*$//' <<<"${uid}")"
        email="$(sed -E 's/.*<([^>]+)>.*/\1/' <<<"${uid}")"
        {
          echo "gpg_key_id=${key_id}"
          echo "gpg_name=${name}"
          echo "gpg_email=${email}"
        } >> "$GITHUB_OUTPUT"
    - name: Commit and push cask update
      shell: bash -xeuo pipefail {0}
      env:
        PACKAGE_VERSION: ${{ inputs.package_version }}
        APP_CASK: ${{ inputs.app_cask }}
        GH_TOKEN: ${{ inputs.token }}
        GPG_KEY_ID: ${{ steps.import-gpg.outputs.gpg_key_id }}
        GPG_NAME: ${{ steps.import-gpg.outputs.gpg_name }}
        GPG_EMAIL: ${{ steps.import-gpg.outputs.gpg_email }}
      run: |
        # commit locally so the change is GPG-signed; the committer identity is
        # derived from the imported key so the email matches a verified address
        gh auth setup-git
        git config gpg.format openpgp
        git config user.name "${GPG_NAME}"
        git config user.email "${GPG_EMAIL}"
        git config user.signingkey "${GPG_KEY_ID}"
        git config commit.gpgsign true
        git add "Casks/${APP_CASK}.rb"
        git commit -S -m "chore(cask): update ${APP_CASK} to ${PACKAGE_VERSION}"
        for _ in 1 2 3 4 5; do
          if git push origin HEAD:main; then
            echo "pushed cask update $(git rev-parse HEAD)"
            exit 0
          fi
          # concurrent runs may advance the branch between read and write;
          # rebase onto the new head and retry (non-fast-forward rejection)
          sleep 10
          git fetch origin main
          git rebase FETCH_HEAD
        done
        echo "could not push cask update after 5 attempts" >&2
        exit 1
