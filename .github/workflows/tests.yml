# brew tap-new generates a PR test workflow; this tap also runs it on direct
# pushes to main, because changes land without a pull request.
name: brew test-bot

on:
  push:
    branches:
      - main
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/**"
      - "packaging/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "renovate.json"
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/**"
      - "packaging/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "renovate.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # macOS is out: all casks are Linux-only. The container leg runs
        # shellcheck, actionlint, typecheck, tests, brew style/audit and the
        # test-bot tap-syntax check.
        # os: [ macos-26 ]
        include:
          - container:
              image: ghcr.io/homebrew/brew:latest@sha256:af4248b6688e954119fc2f61fbd8a26ea85d309df91ac065913d423c57a04549
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    container:
      image: ${{ fromJSON(toJSON(matrix.container)).image }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Homebrew Bundler RubyGems
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Save Homebrew Bundler RubyGems
        # Same-repo PR runs and main pushes may save; fork PRs only restore, so
        # a fork cannot write attacker Ruby into a cache entry main would later
        # restore.
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install packaging dev dependencies
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # In the brew container the tap lives in the tap dir, not GITHUB_WORKSPACE.
          cd "$(brew --repository "$TAP_REPO")"
          bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck the packaging toolchain
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          cd "$(brew --repository "$TAP_REPO")"
          bun run typecheck

      - name: Unit-test the packaging toolchain
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          cd "$(brew --repository "$TAP_REPO")"
          bun run test

      - name: Check packaging tools
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # Every descriptor, its env/output projections, the JSON Schema
          # command, and every cask against its app.json. No AppImage build.
          cd "$(brew --repository "$TAP_REPO")"
          bun run check:tools

      - name: Shellcheck packaging scripts
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # gnupg carries gpg/gpgv, which the Mozilla detached-signature tests
          # exercise against the committed fixture key.
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck gnupg
          else
            apt-get update
            apt-get install -y shellcheck gnupg
          fi
          cd "$(brew --repository "$TAP_REPO")"
          # Globbed, so a new script is linted automatically; -x follows the
          # sourced pipeline libraries.
          find packaging -name '*.sh' -print0 | xargs -0 shellcheck -x -P packaging

      - name: Actionlint workflow lint
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # Renovate owns ACTIONLINT_VERSION; the tarball is trusted as served
          # over HTTPS, with no local SHA-256 to recompute on each bump.
          ACTIONLINT_VERSION="1.7.12"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          cd "$(brew --repository "$TAP_REPO")"
          # No arguments: actionlint discovers .github/workflows/*.yml itself.
          /tmp/actionlint -color

      - name: Style and audit casks
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # The tap is already checked out by setup-homebrew under the brew
          # repository, not $GITHUB_WORKSPACE. No --fix: sandbox corrections
          # are discarded and would mask regressions. The script passes
          # authored files explicitly, so node_modules is not linted.
          cd "$(brew --repository "$TAP_REPO")"
          packaging/scripts/style.sh
          tap_dir="$(brew --repository "$TAP_REPO")"
          for cask in "$tap_dir"/Casks/*.rb; do
            brew audit --cask "edgarcnp/tap/$(basename "$cask" .rb)"
          done

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

  # The build jobs install with --production. This job proves that dependency
  # set is complete before a 60-minute build fails on a missing runtime module.
  runtime-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: ./.github/actions/setup-packaging
      - name: Check the packaging tools with production dependencies only
        run: packaging/scripts/check-tools.sh
