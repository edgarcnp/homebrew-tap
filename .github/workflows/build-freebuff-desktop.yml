name: Build and publish Freebuff Desktop AppImage

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: freebuff-desktop-build
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build-appimage.yml
    secrets: inherit
    with:
      app_cask: freebuff-desktop
      app_name: Freebuff Desktop
      asset_prefix: freebuff-desktop
      tag_prefix: freebuff-desktop-v
      source_owner: edgarcnp
      upstream_repo: edgarcnp/homebrew-tap
      repository_url: https://freebuff.com/api/desktop/updates
      resolve_kind: github
      resolve_script: packaging/freebuff/scripts/resolve-freebuff.js
      resolve_args: --github-repository https://api.github.com/repos/CodebuffAI/codebuff-community
      source_dir: packaging/freebuff
      debloat_args: --add-common --prefer-nano ffmpeg-mini
      build_command: ./scripts/build-appimage.sh
