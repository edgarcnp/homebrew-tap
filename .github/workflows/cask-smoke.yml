name: cask smoke test

on:
  push:
    branches:
      - main
    paths:
      - "Casks/**"
      - "packaging/**"
      - ".github/workflows/**"
  schedule:
    # Every Monday, after the daily AppImage build workflows (00:00 UTC) have
    # published and caught the casks up.
    - cron: '0 1 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  cask-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/homebrew/brew:latest@sha256:63be5353975c43bce2c885742370ab320b3c57541de72fd1458a26a8e35d7d8e
      options: --privileged
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install all casks and verify declared binaries
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          tap_dir="$(brew --repository "$TAP_REPO")"
          cd "$tap_dir"
          # Iterate descriptors rather than cask filenames: the descriptor is
          # the source of truth, and its cask token (== app id) names the file.
          for app in $(bun packaging/bin/fbr.ts list-apps); do
            name="$(bun packaging/bin/fbr.ts descriptor --app "$app" --field cask)"
            cask="Casks/${name}.rb"
            # Casks with a placeholder sha256 can't be installed until their
            # first release is published; skip them unless the asset exists.
            # The cask is read through the shared parser rather than grep.
            cask_json="$(bun packaging/bin/fbr.ts cask --action read --app "$app")"
            if [[ "$(jq -r '.sha256.amd64' <<<"$cask_json")" = "$(printf '0%.0s' {1..64})" ]]; then
              version="$(jq -r '.version' <<<"$cask_json")"
              case "$(uname -m)" in
                aarch64|arm64) arch="aarch64" ;;
                *) arch="x86_64" ;;
              esac
              url="https://github.com/$TAP_REPO/releases/download/${name}-v${version}/${name}-${version}-${arch}.AppImage"
              if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null -I -L "$url"; then
                echo "release asset ${url} not found; skipping ${name} (placeholder sha256 until first publish)" >&2
                continue
              fi
            fi
            brew install --cask "$cask"
            brew info --cask --json=v2 "$cask" | jq -r '.casks[0].artifacts[] | select(.binary) | .target' | while read -r bin; do
              test -x "$bin"
            done
          done
