name: AppImage build

# Reusable pipeline for one app. Everything app-specific comes from
# packaging/apps/<app>/app.json, so adding an app needs no workflow edit.

on:
  workflow_call:
    inputs:
      app:
        description: App id; a directory under packaging/apps holding app.json (e.g. vscode)
        required: true
        type: string
      request_id:
        description: The API's correlation id for the dispatch requesting this run
        required: false
        type: string

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

concurrency:
  group: appimage-build-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      app_id: ${{ steps.app.outputs.id }}
      app_name: ${{ steps.app.outputs.name }}
      app_cask: ${{ steps.app.outputs.cask }}
      asset_prefix: ${{ steps.app.outputs.asset_prefix }}
      tag_prefix: ${{ steps.app.outputs.tag_prefix }}
      needs_webkit: ${{ steps.app.outputs.needs_webkit }}
      builder_image: ${{ steps.builder.outputs.builder_image }}
      architectures: ${{ steps.app.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.resolve.outputs.version }}
      skipped: ${{ steps.resolve.outputs.skipped }}
      repair_cask: ${{ steps.resolve.outputs.repair_cask }}
      reason: ${{ steps.resolve.outputs.reason }}
      cask_version: ${{ steps.resolve.outputs.cask_version }}
      feed_version: ${{ steps.resolve.outputs.feed_version }}
      source: ${{ steps.source.outputs.repo }}
      upstream_sha256_amd64: ${{ steps.resolve.outputs.upstream_sha256_amd64 }}
      upstream_sha256_arm64: ${{ steps.resolve.outputs.upstream_sha256_arm64 }}
      upstream_url_amd64: ${{ steps.resolve.outputs.upstream_url_amd64 }}
      upstream_url_arm64: ${{ steps.resolve.outputs.upstream_url_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Load app descriptor
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          # descriptor-env emits the pipeline's variables: uppercase to
          # $GITHUB_ENV, lowercase to $GITHUB_OUTPUT (which cannot read env).
          bun tap/packaging/bin/fbr.ts descriptor-env --app "${APP}" >> "${GITHUB_ENV}"
          bun tap/packaging/bin/fbr.ts descriptor-env --app "${APP}" --format output >> "${GITHUB_OUTPUT}"
      - name: Select the builder image
        id: builder
        run: |
          # The pins live in packaging/builder/pins.json, kept in step by the
          # builder workflow's pin job; the build job's container reads this
          # output. A malformed file is a config error, not a retry.
          variant=base
          if [[ "${NEEDS_WEBKIT}" == "true" ]]; then variant=webkit; fi
          image="$(jq -r --arg variant "${variant}" '.[$variant]' tap/packaging/builder/pins.json)"
          if [[ ! "${image}" =~ ^ghcr\.io/edgarcnp/fbr-builder-(base|webkit):[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
          then
            echo "::error::pins.json has no usable ${variant} image ref" >&2
            printf '{"code":"DESCRIPTOR_INVALID","message":"builder image pins are missing or malformed"}\n' > "${GITHUB_WORKSPACE}/report-code.json"
            exit 1
          fi
          echo "builder_image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Plan the build matrix
        id: matrix
        run: |
          # Single-arch apps build one AppImage, dual-arch both; the matrix
          # comes from the descriptor, so no workflow edit is needed.
          matrix="$(jq -c '{include: [.[] | select(. == "amd64" or . == "arm64") | if . == "amd64" then {architecture: ., runner: "ubuntu-latest", appimage_arch: "x86_64"} else {architecture: ., runner: "ubuntu-26.04-arm", appimage_arch: "aarch64"} end]}' <<<"${APP_ARCHITECTURES}")"
          [ "$(jq '.include | length' <<<"${matrix}")" -gt 0 ] || {
            echo "::error::no supported architectures in ${APP_ARCHITECTURES}" >&2
            printf '{"code":"DESCRIPTOR_INVALID","message":"descriptor declares no supported architectures"}\n' > "${GITHUB_WORKSPACE}/report-code.json"
            exit 1
          }
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
      - name: Select source repository
        id: source
        run: |
          # Build from the upstream repository when it is reachable; otherwise
          # fall back to this owner's fork of it.
          upstream="${SOURCE_REPO}"
          if git ls-remote --exit-code "https://github.com/${upstream}.git" HEAD >/dev/null 2>&1; then
            echo "repo=${upstream}" >> "${GITHUB_OUTPUT}"
          else
            echo "repo=${SOURCE_OWNER}/${upstream#*/}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repo }}
          path: source
          persist-credentials: false
      - name: Resolve upstream version and gate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the apt resolver verifies a signed index with gpg.
          if [[ "$(bun source/packaging/bin/fbr.ts descriptor --app "${APP_ID}" --field oracle.kind)" == "apt" ]]; then
            sudo apt-get update
            sudo apt-get install -y gnupg
          fi
          cd source
          # The descriptor's watch feed and the oracle resolve asks publish on
          # their own schedules (opencode's update manifest lagged its own
          # release feed by ~1min on 2.0.14, and that run gated on the stale
          # read and skipped). Read the feed once and record what it advertises:
          # nothing waits here -- the caller re-dispatches a skip only when the
          # feed is newer than both the resolved version and the cask pin, which
          # is exactly the signature of a raced publish.
          version=""
          upstream_sha256_amd64=""
          upstream_sha256_arm64=""
          upstream_url_amd64=""
          upstream_url_arm64=""
          while IFS= read -r arch; do
            [ -n "${arch}" ] || continue
            file="upstream/metadata-${arch}.json"
            resolve_rc=0
            # --failure-out: fbr classifies its own failure (a transient upstream
            # outage, a guard violation, a checksum mismatch) and writes the
            # fragment, so this loop never has to guess from an exit code.
            bun packaging/bin/fbr.ts resolve \
              --app "${APP_ID}" --arch "${arch}" --metadata-only \
              --output-dir upstream --metadata "${file}" \
              --failure-out "${GITHUB_WORKSPACE}/report-code.json" || resolve_rc=$?
            if [ "${resolve_rc}" -eq 2 ]; then
              # A usage error is our own bug: classify it so it is never retried.
              printf '{"code":"USAGE","message":"fbr resolve rejected its inputs"}\n' > "${GITHUB_WORKSPACE}/report-code.json"
              exit 2
            elif [ "${resolve_rc}" -ne 0 ]; then
              # 3-6 came back with a fragment already written; anything else has
              # no classification, and the caller's bounded budget covers it.
              exit "${resolve_rc}"
            fi
            arch_version="$(jq -r '.version' "${file}")"
            if [ -z "${version}" ]; then
              version="${arch_version}"
            elif [ "${version}" != "${arch_version}" ]; then
              echo "upstream version mismatch: ${version} vs ${arch_version} (${arch})" >&2
              printf '{"code":"UPSTREAM_CONFLICT","message":"upstream serves a different version per architecture"}\n' > "${GITHUB_WORKSPACE}/report-code.json"
              exit 1
            fi
            sha="$(jq -r '.sha256' "${file}")"
            url="$(jq -r '.repository + "/" + .repositoryPath' "${file}")"
            case "${arch}" in
              amd64)
                upstream_sha256_amd64="${sha}"
                upstream_url_amd64="${url}"
                ;;
              arm64)
                upstream_sha256_arm64="${sha}"
                upstream_url_arm64="${url}"
                ;;
              *)
                echo "unsupported architecture: ${arch}" >&2
                printf '{"code":"DESCRIPTOR_INVALID","message":"descriptor declares an unsupported architecture"}\n' > "${GITHUB_WORKSPACE}/report-code.json"
                exit 1
                ;;
            esac
          done < <(jq -r '.[]' <<<"${APP_ARCHITECTURES}")
          [ -n "${version}" ] || { echo "no architectures resolved" >&2; exit 1; }
          [[ "${version}" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid upstream version: ${version}" >&2; exit 1; }
          version="${version//[^0-9A-Za-z._-]/_}"

          feed_version=""
          feed_rc=0
          feed_report="$(bun "${GITHUB_WORKSPACE}/tap/packaging/bin/fbr.ts" feed-version \
            --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap")" || feed_rc=$?
          if [ "${feed_rc}" -eq 2 ]; then
            # A usage error is our own bug: fail rather than gate blind.
            printf '{"code":"USAGE","message":"fbr feed-version rejected its inputs"}\n' > "${GITHUB_WORKSPACE}/report-code.json"
            exit "${feed_rc}"
          elif [ "${feed_rc}" -ne 0 ]; then
            # The cross-check is advisory: a feed outage must not fail a run
            # that resolve is perfectly able to plan.
            echo "::warning::release feed unavailable (exit ${feed_rc}); recording without the feed cross-check" >&2
          else
            feed_version="$(sed -n 's/^feed_version=//p' <<<"${feed_report}")"
          fi
          cd "${GITHUB_WORKSPACE}"
          {
            echo "feed_version=${feed_version}"
            echo "upstream_sha256_amd64=${upstream_sha256_amd64}"
            echo "upstream_sha256_arm64=${upstream_sha256_arm64}"
            echo "upstream_url_amd64=${upstream_url_amd64}"
            echo "upstream_url_arm64=${upstream_url_arm64}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

          # The gate decision is a unit-tested pure function; the rest of this
          # step gathers its inputs (cask pin, release existence, and whether
          # the published assets still match the cask pin).
          cask_json="$(bun tap/packaging/bin/fbr.ts cask --action read --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap")"
          cask_version="$(jq -r '.version' <<<"${cask_json}")"

          # Distinguish "no such release" (404) from a failed lookup. Reading a
          # transient gh/API error as absence would rebuild an already
          # published version, and the publish job's cleanup would then delete
          # that release.
          release_status="$(gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_PREFIX}${version}" 2>/dev/null \
            | head -n 1 || true)"
          release_exists=false
          case "${release_status}" in
            *" 200 "*)
              release_exists=true
              ;;
            *" 404 "*)
              ;;
            *)
              echo "::error::could not determine whether release ${TAG_PREFIX}${version} exists" >&2
              printf '{"code":"UPSTREAM_UNAVAILABLE","message":"could not determine whether release %s%s exists"}\n' \
                "${TAG_PREFIX}" "${version}" > "${GITHUB_WORKSPACE}/report-code.json"
              exit 1
              ;;
          esac

          matches=""
          if [[ "${release_exists}" = "true" && "${cask_version}" = "${version}" ]]; then
            # release-check prints true|false, or nothing when it could not
            # compare (a shipped arch with no single asset).
            tmp_dir="$(mktemp -d)"
            if timeout 60 gh release download "${TAG_PREFIX}${version}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${ASSET_PREFIX}-*.AppImage" \
              --dir "${tmp_dir}" --clobber
            then
              matches="$(bun tap/packaging/bin/fbr.ts release-check \
                --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" --asset-dir "${tmp_dir}")"
            else
              echo "failed to download release ${TAG_PREFIX}${version}" >&2
            fi
            rm -rf -- "${tmp_dir}"
          fi

          if [[ "${release_exists}" = "true" && "${cask_version}" != "${version}" ]]; then
            # A queued duplicate run may have been queued against a stale
            # branch; re-read the cask from origin/main before deciding.
            if git -C tap fetch --quiet origin main; then
              git -C tap reset --hard --quiet FETCH_HEAD
              cask_version="$(bun tap/packaging/bin/fbr.ts cask --action read --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" | jq -r '.version')"
            fi
          fi

          gate_args=(--app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" --upstream-version "${version}")
          if [[ "${release_exists}" = "true" ]]; then
            gate_args+=(--release-exists)
          fi
          if [[ -n "${matches}" ]]; then
            gate_args+=(--release-matches-cask "${matches}")
          fi
          bun tap/packaging/bin/fbr.ts gate "${gate_args[@]}" | tee -a "${GITHUB_OUTPUT}"

      # A step above classified its own failure in report-code.json; publish it
      # so the report job can prefer the precise verdict over the stage fallback.
      - name: Upload the failure code
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-code-${{ inputs.app }}-detect
          path: report-code.json
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    # packaging/builder/pins.json holds the pinned builder image refs; the
    # detect job picks one per app and the builder workflow's pin job keeps it
    # in step with the images it publishes.
    container:
      image: ${{ needs.detect.outputs.builder_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect.outputs.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - name: Load app descriptor
        env:
          APP: ${{ inputs.app }}
        run: |
          # The tap is the source of truth for the build flags.
          bun "${GITHUB_WORKSPACE}/tap/packaging/bin/fbr.ts" descriptor-env --app "${APP}" >> "${GITHUB_ENV}"
      - name: Install app build packages
        run: |
          # Escape hatch: packages an app still declares in buildPackages, for
          # libraries the builder image does not carry. The webkit apps moved
          # their libayatana-appindicator into the webkit image.
          if [ -n "${BUILD_PACKAGES}" ]; then
            read -r -a packages <<<"${BUILD_PACKAGES}"
            pacman -S --noconfirm "${packages[@]}"
          fi
      - name: Install debloated packages
        run: |
          # Debloated Arch packages shrink the AppImage; flags are per app.
          # One attempt; a flaked download is re-dispatched, not slept on.
          read -r -a flags <<<"${DEBLOAT_ARGS}"
          if ! get-debloated-pkgs "${flags[@]}"; then
            echo "::error::get-debloated-pkgs failed" >&2
            # Names the stage itself: with the toolchain baked into the builder
            # image, this download is the one toolchain step left in the job.
            printf '{"code":"TOOLCHAIN_DOWNLOAD","message":"get-debloated-pkgs failed","stage":"toolchain"}\n' > "${GITHUB_WORKSPACE}/report-code.json"
            exit 1
          fi
      - name: Build AppImage
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          # quick-sharun drives appimagetool via env vars, not CLI args; the
          # builder image installs it on PATH.
          APPIMAGETOOL: /usr/local/bin/appimagetool
          # brew owns updates: UPINFO="" keeps an update-info section out of the
          # artifact (quick-sharun would otherwise guess one from the repo).
          UPINFO: ""
          # Scripts running inside this step classify themselves through the CLI
          # (--failure-out); only a failure nobody claimed gets BUILD_FAILED.
          FBR_FAILURE_OUT: ${{ github.workspace }}/report-code.json
        run: |
          cd source
          [ -z "${SOURCE_DIR}" ] || cd "${SOURCE_DIR}"
          if ! bash -c "${BUILD_COMMAND}"; then
            # A site inside the build (an updater residual, the smoke test) has
            # already named the failure: never overwrite a precise verdict with
            # a generic one.
            if [ ! -s "${FBR_FAILURE_OUT}" ]; then
              printf '{"code":"BUILD_FAILED","message":"build command failed on %s; see the run log"}\n' "${TARGET_ARCH}" > "${FBR_FAILURE_OUT}"
            fi
            exit 1
          fi
          # The command exited 0 but the artifact the publish job downloads is
          # missing: permanent, and the upload step below would report it as an
          # unclassified failure.
          # The pipeline names the file with the AppImage arch (x86_64/aarch64),
          # not the deb/matrix arch (amd64/arm64) -- same mapping the upload
          # step below uses.
          appimage="${GITHUB_WORKSPACE}/source/dist/${ASSET_PREFIX}-${PACKAGE_VERSION}-${{ matrix.appimage_arch }}.AppImage"
          if [ ! -s "${appimage}" ]; then
            printf '{"code":"ARTIFACT_MISSING","message":"the build produced no AppImage at %s"}\n' "${appimage}" > "${FBR_FAILURE_OUT}"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.detect.outputs.asset_prefix }}-${{ matrix.appimage_arch }}
          path: source/dist/${{ needs.detect.outputs.asset_prefix }}-${{ needs.detect.outputs.version }}-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error
          retention-days: 7

      # Same contract as detect: a classified build failure (toolchain download
      # or the build command itself) is worth retrying on different terms than
      # an unclassified one, and the per-arch name keeps parallel failures from
      # colliding.
      - name: Upload the failure code
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-code-${{ inputs.app }}-build-${{ matrix.architecture }}
          path: report-code.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # Retention sorts tags with the pipeline's dpkg ordering, so it needs the
      # tap and the CLI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.detect.outputs.asset_prefix }}-*
          merge-multiple: true
          path: assets
      - name: Generate release notes
        env:
          UPSTREAM_SHA_AMD64: ${{ needs.detect.outputs.upstream_sha256_amd64 }}
          UPSTREAM_SHA_ARM64: ${{ needs.detect.outputs.upstream_sha256_arm64 }}
          UPSTREAM_URL_AMD64: ${{ needs.detect.outputs.upstream_url_amd64 }}
          UPSTREAM_URL_ARM64: ${{ needs.detect.outputs.upstream_url_arm64 }}
          APP_ID: ${{ needs.detect.outputs.app_id }}
        run: |
          # The table and prose come from a unit-tested command; only the
          # optional per-arch upstream rows are assembled here.
          upstream_args=(--upstream "amd64=${UPSTREAM_SHA_AMD64}=${UPSTREAM_URL_AMD64}")
          if [ -n "${UPSTREAM_SHA_ARM64}" ]; then
            upstream_args+=(--upstream "arm64=${UPSTREAM_SHA_ARM64}=${UPSTREAM_URL_ARM64}")
          fi
          bun tap/packaging/bin/fbr.ts release-notes \
            --app "${APP_ID}" \
            --asset-dir assets \
            "${upstream_args[@]}" \
            --output release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          APP_NAME: ${{ needs.detect.outputs.app_name }}
          ASSET_PREFIX: ${{ needs.detect.outputs.asset_prefix }}
        run: |
          TAG="${TAG_PREFIX}${PACKAGE_VERSION}"
          shopt -s nullglob
          appimages=(assets/"${ASSET_PREFIX}"-*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "::error::no AppImage artifacts matched assets/${ASSET_PREFIX}-*.AppImage" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${APP_NAME} ${PACKAGE_VERSION}" \
            --notes-file release-notes.md \
            "${appimages[@]}"
          # Marker for the cleanup step: only a release this run created may be
          # removed on a later failure.
          touch "${RUNNER_TEMP}/release-created"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/${{ needs.detect.outputs.asset_prefix }}-*.AppImage

      - name: Retain only the 3 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
        run: |
          # release-prune picks the stale versions by dpkg ordering (never
          # `sort -V`, which disagrees) and prints them oldest first, or nothing
          # when all are within the window. A failing gh call or unparseable tag
          # fails the step instead of pruning a short list.
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName')"
          mapfile -t tag_list <<< "${tags}"

          stale="$(bun tap/packaging/bin/fbr.ts release-prune \
            --prefix "${TAG_PREFIX}" --keep 3 "${tag_list[@]}")"
          if [ -z "${stale}" ]; then
            echo "retaining all releases; nothing stale"
            exit 0
          fi
          while IFS= read -r version
          do
            printf 'deleting release %s%s\n' "${TAG_PREFIX}" "${version}"
            gh release delete "${TAG_PREFIX}${version}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done <<< "${stale}"

      # A half-published release blocks the next dispatch (the gate would see
      # the tag and skip), so a failure in this job removes the release it
      # created; the caller's re-dispatch then rebuilds from scratch. A release
      # that predates this run is not ours to delete. pin-cask runs separately
      # and keeps its tag: a pin failure repairs cheaply.
      - name: Remove the partial release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          TAG="${TAG_PREFIX}${PACKAGE_VERSION}"
          REF="repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
          if [ ! -f "${RUNNER_TEMP}/release-created" ]; then
            # Never touch a release or tag this run did not create: an earlier
            # published release must survive a failed rebuild.
            echo "this run did not create release ${TAG}; leaving any existing release and tag alone"
            exit 0
          fi
          # This run created the release; a failure after create leaves it
          # half-published, so remove it and its tag. If it is already gone,
          # remove a leftover tag ref so the next create is not blocked.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "removing tag ${TAG}, which has no release"
            gh api --method DELETE "${REF}"
          fi

  # Covers both gate outcomes: a fresh build (after publish) and a cask-only
  # repair (publish skipped). always() runs it when publish was skipped; the
  # build path still requires publish to succeed.
  pin-cask:
    needs: [detect, publish]
    if: >-
      always() && needs.detect.outputs.skipped == 'false' &&
      (needs.detect.outputs.repair_cask == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: push-casks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Pin cask to published release
        uses: ./.github/actions/update-cask
        with:
          app: ${{ needs.detect.outputs.app_id }}
          package_version: ${{ needs.detect.outputs.version }}
          tag_prefix: ${{ needs.detect.outputs.tag_prefix }}
          asset_prefix: ${{ needs.detect.outputs.asset_prefix }}
          token: ${{ secrets.HOMEBREW_PAT }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

  # The machine-readable run record: one JSON document per app, uploaded as
  # run-report-<app>. The API that dispatches builds reads it to decide
  # whether a failure is worth re-dispatching; retry policy lives there, not
  # here. always() so every completed run answers with a record: an absent
  # record means the run died before this job could start (runner loss,
  # cancellation), which the API treats as infrastructure.
  report:
    needs: [detect, build, publish, pin-cask]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The delivery below authenticates to the API with a GitHub OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Failure sites that classified themselves upload report-code.json under a
      # per-job name. continue-on-error covers the normal case: nothing to
      # classify, or a failure the site itself did not recognize.
      - name: Download the failure codes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-code-${{ inputs.app }}-*
          path: report-codes
        continue-on-error: true
      - name: Write the run record
        id: write_report
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PIN_CASK_RESULT: ${{ needs.pin-cask.result }}
          SKIPPED: ${{ needs.detect.outputs.skipped }}
          REPAIR_CASK: ${{ needs.detect.outputs.repair_cask }}
          REASON: ${{ needs.detect.outputs.reason }}
          RESOLVED_VERSION: ${{ needs.detect.outputs.version }}
          CASK_VERSION: ${{ needs.detect.outputs.cask_version }}
          FEED_VERSION: ${{ needs.detect.outputs.feed_version }}
          APP_ID: ${{ needs.detect.outputs.app_id }}
          REQUESTED_APP: ${{ inputs.app }}
          REQUEST_ID: ${{ inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The first unsuccessful job in pipeline order names the stage; a
          # cancelled job counts too, so a partially cancelled run still
          # answers instead of leaving the API to guess from silence.
          job_stage=""
          job_result=""
          for pair in "detect:${DETECT_RESULT}" "build:${BUILD_RESULT}" \
                     "publish:${PUBLISH_RESULT}" "pin-cask:${PIN_CASK_RESULT}"; do
            result="${pair#*:}"
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              job_stage="${pair%%:*}"
              job_result="${result}"
              break
            fi
          done

          # detect may have failed before loading the descriptor.
          app="${APP_ID:-${REQUESTED_APP}}"

          # Prefer the verdict the failing site wrote for itself over the stage
          # fallback: code, message, the stage it knows it failed in, and any
          # transport-level evidence. Multiple parallel failures (a two-arch
          # build that lost both races) resolve deterministically: alphabetical
          # glob order.
          shopt -s nullglob
          fragments=(report-codes/*/report-code.json)
          fragment_code=""
          fragment_message=""
          fragment_stage=""
          fragment_evidence=()
          if (( ${#fragments[@]} > 0 )); then
            fragment_code="$(jq -r '.code // empty' "${fragments[0]}" 2>/dev/null || true)"
            fragment_message="$(jq -r '.message // empty' "${fragments[0]}" 2>/dev/null || true)"
            fragment_stage="$(jq -r '.stage // empty' "${fragments[0]}" 2>/dev/null || true)"
            while IFS= read -r pair; do
              [ -n "${pair}" ] && fragment_evidence+=(--evidence "${pair}")
            done < <(jq -r '.evidence // {} | to_entries[] | "\(.key)=\(.value)"' \
              "${fragments[0]}" 2>/dev/null || true)
          fi

          stage=""
          code=""
          if [[ -n "${job_stage}" ]]; then
            status="failed"
            stage="${fragment_stage:-${job_stage}}"
            if [[ -n "${fragment_code}" ]]; then
              code="${fragment_code}"
              message="${fragment_message:-${job_stage} job ${job_result}; see the run log}"
            else
              # No classified site: publish and pin failures are still precise
              # at job granularity, and everything else is UNCLASSIFIED, which
              # retries under the API's global budget rather than being dropped.
              case "${job_stage}" in
                publish) code="PUBLISH_FAILED" ;;
                pin-cask) code="PIN_CASK_FAILED" ;;
                *) code="UNCLASSIFIED" ;;
              esac
              message="${job_stage} job ${job_result}; see the run log"
            fi
          elif [[ "${SKIPPED}" == "true" ]]; then
            status="skipped"
            stage="detect"
            message="${REASON:-already at upstream}"
          elif [[ "${REPAIR_CASK}" == "true" ]]; then
            status="repair-cask"
            stage="pin-cask"
            message="${REASON:-cask pin caught up to the published release}"
          else
            status="success"
            stage="publish"
            message="${REASON:-run completed}"
          fi

          args=(
            report
            --app "${app}"
            --stage "${stage}"
            --status "${status}"
            --message "${message}"
            --run-id "${RUN_ID}"
            --request-id "${REQUEST_ID}"
            --event-id "${RUN_ID}:${GITHUB_RUN_ATTEMPT}:${app}"
            --resolved-version "${RESOLVED_VERSION}"
            --cask-version "${CASK_VERSION}"
            --feed-version "${FEED_VERSION}"
            --output "${RUNNER_TEMP}/run-report.json"
          )
          if [[ -n "${code}" ]]; then
            args+=(--code "${code}")
          fi
          # Only a classified failure carries evidence; the CLI rejects it on
          # any other status.
          if [[ -n "${code}" && ${#fragment_evidence[@]} -gt 0 ]]; then
            args+=("${fragment_evidence[@]}")
          fi
          bun packaging/bin/fbr.ts "${args[@]}"
      - name: Upload the run record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-report-${{ inputs.app }}
          path: ${{ runner.temp }}/run-report.json
          if-no-files-found: error
          retention-days: 7
      # The API consumes the record as an event; the artifact above stays for
      # humans. Auth is GitHub OIDC: a fresh ~5-minute JWT per delivery, bound to
      # this run; there is no shared secret. Best-effort by design — a delivery
      # failure must never fail the run, and the API reconciles a lost report
      # from the run id it dispatched with. 4xx is permanent (bad/expired token,
      # unknown cask, invalid body) and is reported once; 000/5xx are retried.
      # The workflow's default -x would trace the JWT into the log, so this
      # step turns xtrace off before touching it.
      - name: Deliver the run record to the API
        if: always() && steps.write_report.outcome == 'success'
        continue-on-error: true
        env:
          RECORD: ${{ runner.temp }}/run-report.json
        run: |
          set +x
          if [[ ! -f "${RECORD}" ]]; then
            echo "::warning::no run record to deliver"
            exit 0
          fi
          id_token="$(
            curl --fail --silent --show-error --max-time 10 \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.edgarcnp.dev" \
              | jq -r '.value'
          )" || id_token=""
          if [[ -z "${id_token}" || "${id_token}" == "null" ]]; then
            echo "::warning::could not obtain an OIDC token; skipping delivery"
            exit 0
          fi
          endpoint="https://api.edgarcnp.dev/v1/homebrew/tap/events"
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --max-time 10 --output /dev/null \
              --write-out '%{http_code}' \
              -X POST "${endpoint}" \
              -H "Authorization: Bearer ${id_token}" \
              -H "Content-Type: application/json" \
              --data-binary "@${RECORD}" || true)"
            case "${status}" in
              2??) echo "run record delivered (HTTP ${status})"; exit 0 ;;
              4??) echo "::warning::API rejected the run record (HTTP ${status})"; exit 0 ;;
            esac
            sleep $((attempt * 5))
          done
          echo "::warning::run record delivery failed; the API will reconcile the run"
