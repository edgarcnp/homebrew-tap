# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # macOS: all casks are Linux-only (depends_on :linux); the Ubuntu
        # container leg below runs shellcheck, actionlint, brew style/audit
        # and the test-bot tap-syntax check.
        # os: [ macos-26 ]
        include:
          - container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Shellcheck packaging scripts
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            apt-get update
            apt-get install -y shellcheck
          fi
          # in the brew container the tap checkout lives in the tap
          # directory, not under GITHUB_WORKSPACE
          cd "$(brew --repository "${{ github.repository }}")"
          shellcheck packaging/scripts/*.sh packaging/lib/*.sh packaging/vscode/scripts/*.sh packaging/opencode/scripts/*.sh
          for apprun in packaging/vscode/templates/AppRun packaging/opencode/templates/AppRun; do
            if grep -q '^#!' "$apprun"; then
              shellcheck "$apprun"
            else
              echo "$apprun has no shebang; skipping shellcheck" >&2
            fi
          done

      - name: Actionlint workflow lint
        run: |
          # latest release, verified against the sha256 checksums file
          # shipped alongside the binaries in the same release
          version="$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/rhysd/actionlint/releases/latest | sed 's#.*/v##')"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/actionlint-checksums.txt \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt"
          test -s /tmp/actionlint.tar.gz
          test -s /tmp/actionlint-checksums.txt
          expected="$(grep -F "actionlint_${version}_linux_amd64.tar.gz" /tmp/actionlint-checksums.txt | awk '{print $1}')"
          got="$(sha256sum /tmp/actionlint.tar.gz | awk '{print $1}')"
          [ "$expected" = "$got" ] || { echo "actionlint checksum mismatch: got $got, expected $expected" >&2; exit 1; }
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          cd "$(brew --repository "${{ github.repository }}")"
          /tmp/actionlint -color .github/workflows/build-appimage.yml .github/workflows/build-vscode.yml .github/workflows/build-opencode-desktop.yml .github/workflows/cask-smoke.yml .github/workflows/tests.yml .github/workflows/autobump.yml .github/workflows/publish.yml

      - name: Style and audit casks
        run: |
          # the tap is already checked out by setup-homebrew
          # no --fix: corrections in the sandbox are discarded, so they would
          # mask style regressions instead of failing the run
          brew style edgarcnp/tap
          tap_dir="$(brew --repository "${{ github.repository }}")"
          for cask in "$tap_dir"/Casks/*.rb; do
            brew audit --cask "edgarcnp/tap/$(basename "$cask" .rb)"
          done

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
