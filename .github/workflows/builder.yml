name: Builder image

# Builds the pinned Arch image every AppImage build job runs in: the shared
# base toolchain (pacman packages, quick-sharun, appimagetool, Bun) baked once
# instead of reinstalled per run. Per-app pack-time packages stay in the
# descriptor's buildPackages.
#
# Renovate owns the pins inside the image (packaging/builder/Dockerfile); the
# pin job below commits the pushed tag+digest into packaging/builder/pins.json,
# which the AppImage build workflow reads for its container image.

on:
  push:
    branches:
      - main
    paths:
      # Only the Dockerfile changes the image; pins.json is written back by the
      # pin job below and must not retrigger this workflow.
      - packaging/builder/Dockerfile
      - packaging/scripts/install-anylinux-tools.sh
      - .github/workflows/builder.yml
  schedule:
    # Weekly Arch refresh at 00:00 UTC; base/tool bumps arrive as Renovate PRs
    # instead.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: builder-image-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose the image reference
        id: image
        run: |
          # GHCR requires a lowercase path; date.run makes the tag sortable.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${owner}/fbr-builder-base:$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "ref=ghcr.io/${tag}" >> "${GITHUB_OUTPUT}"
      - name: Build the image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker build \
            --file packaging/builder/Dockerfile \
            --tag "${IMAGE_REF}" \
            .
      - name: Smoke-test the image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          # Single-quoted on purpose: the script runs inside the container.
          docker run --rm "${IMAGE_REF}" bash -euc '
            for tool in quick-sharun get-debloated-pkgs appimagetool bun; do
              command -v "${tool}"
            done
            bun --version
            pacman -Qq dpkg gnupg jq patchelf >/dev/null
          '
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The workflow's default -x would trace the token into the log.
          set +x
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push the image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker push "${IMAGE_REF}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE_REF}" 2>/dev/null || true)"
          sha="sha256:${digest##*sha256:}"
          [[ "${sha}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${IMAGE_REF}"; exit 1; }
          echo "${IMAGE_REF}@${sha}" > image-ref.txt
          {
            echo "### Builder image pushed"
            echo ""
            echo "\`$(cat image-ref.txt)\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref
          path: image-ref.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # After the image is pushed, commit the new tag+digest into
  # packaging/builder/pins.json so dispatches always run the image this
  # workflow produced. Signed and pushed with the same PAT the cask pins use,
  # because main requires changes through a PR; the pins live outside
  # .github/workflows/ so that PAT needs no `workflow` scope.
  pin:
    needs: build
    # A dispatch from a feature branch must not pin its image onto main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: pin-builder-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-ref
          path: image-refs
      - name: Pin the builder image
        run: |
          bash packaging/scripts/pin-builder-image.sh \
            packaging/builder/pins.json \
            "$(cat image-refs/image-ref.txt)"
      - name: Import GPG signing key
        id: import-gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set +x
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          uid="$(gpg --list-secret-keys --keyid-format=long | awk '/^uid/ {print; exit}')"
          key_id="$(gpg --list-secret-keys --keyid-format=long | awk '/^sec/ {print $2; exit}' | cut -d/ -f2)"
          name="$(sed -E 's/^uid\s+\[[^]]*\]\s+//; s/\s*<[^>]+>\s*$//' <<<"${uid}")"
          email="$(sed -E 's/.*<([^>]+)>.*/\1/' <<<"${uid}")"
          {
            echo "gpg_key_id=${key_id}"
            echo "gpg_name=${name}"
            echo "gpg_email=${email}"
          } >> "$GITHUB_OUTPUT"
      - name: Commit and push the pin
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_PAT }}
          GPG_KEY_ID: ${{ steps.import-gpg.outputs.gpg_key_id }}
          GPG_NAME: ${{ steps.import-gpg.outputs.gpg_name }}
          GPG_EMAIL: ${{ steps.import-gpg.outputs.gpg_email }}
        run: |
          tag="$(sed -E 's/^.*:([^:@]+)@.*$/\1/' image-refs/image-ref.txt)"
          if git diff --quiet; then
            echo "already pinned to ${tag}; nothing to commit"
            exit 0
          fi
          gh auth setup-git
          git config gpg.format openpgp
          git config user.name "${GPG_NAME}"
          git config user.email "${GPG_EMAIL}"
          git config user.signingkey "${GPG_KEY_ID}"
          git config commit.gpgsign true
          git add packaging/builder/pins.json
          git commit -S -m "chore(ci): pin the builder image to ${tag}"
          for _ in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pinned the builder image to ${tag}"
              exit 0
            fi
            # A concurrent cask pin may advance main; rebase and retry.
            sleep 10
            git fetch origin main
            git rebase FETCH_HEAD
          done
          echo "could not push the builder image pin after 5 attempts" >&2
          exit 1
