name: Build AppImages

# Single entry point for building AppImages. The app list comes from
# packaging/apps/*/app.json, so adding an app needs no workflow edit. Each app
# runs as its own call of the reusable build workflow, which keeps per-app
# concurrency groups and lets one app fail without blocking the others.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App id to build, or "all" (see packaging/apps/*/app.json)
        required: false
        default: all
        type: string
      request_id:
        description: The API's correlation id for the dispatch requesting this run
        required: false
        type: string
  workflow_call:
    inputs:
      app:
        description: App id to build, or "all"
        required: true
        type: string
      request_id:
        description: The API's correlation id for the dispatch requesting this run
        required: false
        type: string

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

concurrency:
  group: appimage-plan-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The plan-failure record is delivered to the API over OIDC.
      id-token: write
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Plan the app matrix
        id: plan
        env:
          REQUESTED: ${{ inputs.app }}
        run: |
          all="$(bun packaging/bin/fbr.ts list-apps --json)"
          [[ -n "${REQUESTED}" ]] || { echo "::error::no app requested" >&2; exit 1; }
          if [[ "${REQUESTED}" = "all" ]]; then
            echo "apps=${all}" >> "${GITHUB_OUTPUT}"
            echo "building all apps: $(jq -r 'join(", ")' <<<"${all}")"
          else
            # API dispatch names apps by cask token and manual runs pass app
            # ids; the two are the same string (the descriptor requires
            # id === cask), so resolve-app is one lookup and fails loudly when
            # the name matches no app.
            resolved_rc=0
            resolved="$(bun packaging/bin/fbr.ts resolve-app --name "${REQUESTED}")" || resolved_rc=$?
            if [ "${resolved_rc}" -ne 0 ]; then
              # A namable request gets a classified fragment; the run-record
              # step below turns it into UNKNOWN_APP, so the API fixes the name
              # instead of re-dispatching the typo until its budget runs out. An
              # unnamable one (not an app id the API would accept) stays
              # unclassified on purpose.
              if [[ "${REQUESTED}" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
                printf '{"code":"UNKNOWN_APP","message":"no app matches %s; see the run log"}\n' "${REQUESTED}" > report-code.json
              fi
              exit "${resolved_rc}"
            fi
            echo "apps=$(jq -c --arg app "${resolved}" '[ $app ]' <<<"${all}")" >> "${GITHUB_OUTPUT}"
          fi

      # A planning failure is a caller-side config error, not infrastructure, so
      # it answers with the same run record the build jobs write. The record is
      # best-effort: an unsafe token cannot be named in a record, and fbr
      # refuses rather than writing one the API could not attribute.
      - name: Write the run record
        id: plan_report
        if: failure()
        continue-on-error: true
        env:
          REQUESTED: ${{ inputs.app }}
          REQUEST_ID: ${{ inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The step carries the API's correlation id; never trace it.
          set +x
          code="$(jq -r '.code // empty' report-code.json 2>/dev/null || true)"
          message="$(jq -r '.message // empty' report-code.json 2>/dev/null || true)"
          if bun packaging/bin/fbr.ts report \
            --app "${REQUESTED}" \
            --stage plan \
            --status failed \
            --code "${code:-UNCLASSIFIED}" \
            --message "${message:-the build plan failed; see the run log}" \
            --run-id "${RUN_ID}" \
            --request-id "${REQUEST_ID}" \
            --event-id "${RUN_ID}:${GITHUB_RUN_ATTEMPT}:${REQUESTED}" \
            --public-output "${RUNNER_TEMP}/run-report-public.json" \
            --output "${RUNNER_TEMP}/run-report.json"; then
            echo "wrote=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload the run record
        if: always() && steps.plan_report.outputs.wrote == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-report-${{ inputs.app }}
          path: ${{ runner.temp }}/run-report-public.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # The API consumes the record as an event; the artifact above stays for
      # humans. Auth is GitHub OIDC: a fresh ~5-minute JWT per delivery, bound to
      # this run; there is no shared secret. Best-effort by design — a delivery
      # failure must never fail the run, and the API reconciles a lost report
      # from the run id it dispatched with. A bad/expired token, an unknown cask
      # or an invalid body is permanent 4xx and is reported once; 429 is the rate
      # limiter, retried after Retry-After; 000/5xx are retried.
      # The workflow's default -x would trace the JWT into the log, so this
      # step turns xtrace off before touching it.
      - name: Deliver the run record to the API
        if: always() && steps.plan_report.outputs.wrote == 'true'
        continue-on-error: true
        env:
          RECORD: ${{ runner.temp }}/run-report.json
        run: |
          set +x
          if [[ ! -f "${RECORD}" ]]; then
            echo "::warning::no run record to deliver"
            exit 0
          fi
          id_token="$(
            curl --fail --silent --show-error --max-time 10 \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.edgarcnp.dev" \
              | jq -r '.value'
          )" || id_token=""
          if [[ -z "${id_token}" || "${id_token}" == "null" ]]; then
            echo "::warning::could not obtain an OIDC token; skipping delivery"
            exit 0
          fi
          endpoint="https://api.edgarcnp.dev/v1/homebrew/tap/events"
          headers="${RUNNER_TEMP}/delivery-headers.txt"
          body="${RUNNER_TEMP}/delivery-body.txt"
          # A rejected record must name which layer answered: the API edge adds
          # server, cf-ray and cf-mitigated, the API does not. The excerpt is
          # bounded to 512 bytes and flattened onto one line.
          header_value() {
            tr -d '\r' <"${headers}" 2>/dev/null \
              | awk -F: -v name="$1" 'tolower($1) == name { sub(/^[^:]*:[ ]*/, ""); value=$0 } END { print value }' \
              || true
          }
          log_rejection() {
            local excerpt
            excerpt="$(head -c 512 "${body}" 2>/dev/null \
              | tr '\r\n\t' ' ' \
              | LC_ALL=C tr -c '[:print:]' '?' || true)"
            echo "API response body (first 512 bytes): ${excerpt}"
            echo "API response headers: server=$(header_value server) cf-ray=$(header_value cf-ray) cf-mitigated=$(header_value cf-mitigated) content-type=$(header_value content-type)"
          }
          # Three attempts total. A 429 is the API's rate limiter, not a
          # verdict: back off for Retry-After (capped, defaulted when absent)
          # and try again instead of dropping the record.
          for attempt in 1 2 3; do
            : >"${headers}"
            : >"${body}"
            status="$(curl --silent --show-error --max-time 10 --output "${body}" \
              --dump-header "${headers}" --write-out '%{http_code}' \
              -X POST "${endpoint}" \
              -H "Authorization: Bearer ${id_token}" \
              -H "Content-Type: application/json" \
              --data-binary "@${RECORD}" || true)"
            # 000 is a transport failure with no response to describe.
            if [[ "${status}" != 2?? && "${status}" != 000 ]]; then
              log_rejection
            fi
            case "${status}" in
              2??) echo "run record delivered (HTTP ${status})"; exit 0 ;;
              429)
                retry_after="$(
                  tr -d '\r' <"${headers}" \
                    | awk -F: 'tolower($1) == "retry-after" { print $2 }' \
                    | tail -n 1 \
                    | tr -d '[:space:]'
                )"
                if [[ ! "${retry_after}" =~ ^[0-9]+$ ]]; then
                  # No parsable Retry-After: the API's usual window.
                  retry_after=60
                fi
                if ((retry_after > 120)); then
                  retry_after=120
                fi
                echo "::warning::API rate-limited the run record (HTTP 429); retrying in ${retry_after}s"
                sleep "${retry_after}"
                continue
                ;;
              4??) echo "::warning::API rejected the run record (HTTP ${status})"; exit 0 ;;
            esac
            sleep $((attempt * 5))
          done
          echo "::warning::run record delivery failed; the API will reconcile the run"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build-appimage.yml
    secrets: inherit
    with:
      app: ${{ matrix.app }}
      request_id: ${{ inputs.request_id }}
