name: Dispatch build

# Sole repository_dispatch subscriber: a trigger-build event names the app to
# build (or "all"). Routing lives in the build workflow's plan job, so an
# unknown or missing app fails loudly instead of matching no job at all.

on:
  repository_dispatch:
    types: [trigger-build]

permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      app: ${{ github.event.client_payload.app }}
