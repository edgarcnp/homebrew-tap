name: Pin cask to published release
description: >-
  Verify a release was published by this pipeline's bot account as a final
  release, download its AppImage assets, update the cask's version and SHA-256
  with the fbr CLI, then commit and push (retrying on a non-fast-forward).
  Shared by the pin-cask paths so the trust check and the push live in one place.
inputs:
  app:
    description: App id whose cask to update (a directory under packaging/apps)
    required: true
  package_version:
    description: Upstream version to pin into the cask
    required: true
  tag_prefix:
    description: Release tag prefix (e.g. my-app-v)
    required: true
  asset_prefix:
    description: Release asset filename prefix (e.g. my-app)
    required: true
  token:
    description: GitHub token with contents:write on the default branch
    required: true
  gpg_private_key:
    description: GPG private key used to sign the cask update commit
    required: true
outputs:
  cask:
    description: Cask token that was updated
    value: ${{ steps.update.outputs.cask }}
runs:
  using: composite
  steps:
    - name: Update cask version and checksums
      id: update
      shell: bash -xeuo pipefail {0}
      env:
        APP: ${{ inputs.app }}
        PACKAGE_VERSION: ${{ inputs.package_version }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        ASSET_PREFIX: ${{ inputs.asset_prefix }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        [[ "$PACKAGE_VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid version: $PACKAGE_VERSION" >&2; exit 1; }
        # fbr validates the prefixes and checksum shapes, failing rather than
        # half-updating the file.
        cask="$(bun packaging/bin/fbr.ts descriptor --app "${APP}" --field cask)"
        tag_prefix="$(bun packaging/bin/fbr.ts descriptor --app "${APP}" --field tagPrefix)"
        asset_prefix="$(bun packaging/bin/fbr.ts descriptor --app "${APP}" --field assetPrefix)"
        [[ "$tag_prefix" == "$TAG_PREFIX" && "$asset_prefix" == "$ASSET_PREFIX" ]] \
          || { echo "descriptor prefixes disagree with the workflow inputs" >&2; exit 1; }
        echo "cask=${cask}" >> "$GITHUB_OUTPUT"
        # Only trust assets from a final release this pipeline's bot published;
        # anyone with contents:write could otherwise re-upload and be pinned.
        release_meta="$(gh release view "${TAG_PREFIX}${PACKAGE_VERSION}" \
          --repo "$GITHUB_REPOSITORY" --json author,isDraft,isPrerelease \
          --jq '[.author.login, (.isDraft|tostring), (.isPrerelease|tostring)] | join(" ")')"
        read -r release_author release_draft release_prerelease <<<"${release_meta}"
        if [[ "${release_author}" != "github-actions[bot]" \
          || "${release_draft}" == "true" \
          || "${release_prerelease}" == "true" ]]; then
          echo "warning: release ${TAG_PREFIX}${PACKAGE_VERSION} (author=${release_author}, draft=${release_draft}, prerelease=${release_prerelease}) is not a trusted bot release; not pinning cask, rebuild required" >&2
          exit 1
        fi
        # Hash the released assets (not the run artifacts) so the cask matches
        # the release. Single-arch apps publish one AppImage.
        arches="$(bun packaging/bin/fbr.ts descriptor --app "${APP}" --field architectures)"
        patterns=()
        [[ "${arches}" == *amd64* ]] && patterns+=(--pattern "${ASSET_PREFIX}-*-x86_64.AppImage")
        [[ "${arches}" == *arm64* ]] && patterns+=(--pattern "${ASSET_PREFIX}-*-aarch64.AppImage")
        [ "${#patterns[@]}" -gt 0 ] || { echo "no supported architectures in ${arches}" >&2; exit 1; }
        gh release download "${TAG_PREFIX}${PACKAGE_VERSION}" \
          --repo "$GITHUB_REPOSITORY" \
          "${patterns[@]}" \
          --dir assets --clobber
        set_args=(--action set-version --app "${APP}" --version "${PACKAGE_VERSION}")
        if [[ "${arches}" == *amd64* ]]; then
          x86_64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-x86_64.AppImage | awk '{print $1}')"
          set_args+=(--sha256-x86-64 "${x86_64_sha}")
        fi
        if [[ "${arches}" == *arm64* ]]; then
          arm64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-aarch64.AppImage | awk '{print $1}')"
          set_args+=(--sha256-arm-64 "${arm64_sha}")
        fi
        bun packaging/bin/fbr.ts cask "${set_args[@]}"
    - name: Import GPG signing key
      id: import-gpg
      shell: bash -xeuo pipefail {0}
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg_private_key }}
      run: |
        echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
        uid="$(gpg --list-secret-keys --keyid-format=long | awk '/^uid/ {print; exit}')"
        key_id="$(gpg --list-secret-keys --keyid-format=long | awk '/^sec/ {print $2; exit}' | cut -d/ -f2)"
        name="$(sed -E 's/^uid\s+\[[^]]*\]\s+//; s/\s*<[^>]+>\s*$//' <<<"${uid}")"
        email="$(sed -E 's/.*<([^>]+)>.*/\1/' <<<"${uid}")"
        {
          echo "gpg_key_id=${key_id}"
          echo "gpg_name=${name}"
          echo "gpg_email=${email}"
        } >> "$GITHUB_OUTPUT"
    - name: Commit and push cask update
      shell: bash -xeuo pipefail {0}
      env:
        PACKAGE_VERSION: ${{ inputs.package_version }}
        APP_CASK: ${{ steps.update.outputs.cask }}
        GH_TOKEN: ${{ inputs.token }}
        GPG_KEY_ID: ${{ steps.import-gpg.outputs.gpg_key_id }}
        GPG_NAME: ${{ steps.import-gpg.outputs.gpg_name }}
        GPG_EMAIL: ${{ steps.import-gpg.outputs.gpg_email }}
      run: |
        # Commit locally to sign with the imported key's identity.
        gh auth setup-git
        git config gpg.format openpgp
        git config user.name "${GPG_NAME}"
        git config user.email "${GPG_EMAIL}"
        git config user.signingkey "${GPG_KEY_ID}"
        git config commit.gpgsign true
        git add "Casks/${APP_CASK}.rb"
        git commit -S -m "chore(cask): update ${APP_CASK} to ${PACKAGE_VERSION}"
        for _ in 1 2 3 4 5; do
          if git push origin HEAD:main; then
            echo "pushed cask update $(git rev-parse HEAD)"
            exit 0
          fi
          # A concurrent run may advance the branch; rebase and retry.
          sleep 10
          git fetch origin main
          git rebase FETCH_HEAD
        done
        echo "could not push cask update after 5 attempts" >&2
        exit 1
