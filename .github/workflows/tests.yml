# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/**"
      - "packaging/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "renovate.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # macOS is out: all casks are Linux-only. The container leg runs
        # shellcheck, actionlint, typecheck, tests, brew style/audit and the
        # test-bot tap-syntax check.
        # os: [ macos-26 ]
        include:
          - container:
              image: ghcr.io/homebrew/brew:latest@sha256:1c791c9af3aee7749225f8f6ff18a23dcd2a81abc65cd6be0aad24192b7219e4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    container:
      image: ${{ fromJSON(toJSON(matrix.container)).image }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Homebrew Bundler RubyGems
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Save Homebrew Bundler RubyGems
        # PR runs only restore; saving is skipped so a fork PR cannot write
        # attacker Ruby into a cache entry main would later restore (poisoning).
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install packaging dev dependencies
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # In the brew container the tap lives in the tap dir, not GITHUB_WORKSPACE.
          cd "$(brew --repository "$TAP_REPO")"
          bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck the packaging toolchain
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          cd "$(brew --repository "$TAP_REPO")"
          bun run typecheck

      - name: Unit-test the packaging toolchain
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          cd "$(brew --repository "$TAP_REPO")"
          bun test

      - name: Check casks against their app descriptors
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # One parser for Casks/*.rb; fails when a cask drifts from its app.json.
          cd "$(brew --repository "$TAP_REPO")"
          bun packaging/bin/fbr.ts cask --action check

      - name: Shellcheck packaging scripts
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            apt-get update
            apt-get install -y shellcheck
          fi
          cd "$(brew --repository "$TAP_REPO")"
          # Globbed, so a new script is linted automatically; -x follows the
          # sourced pipeline libraries.
          find packaging -name '*.sh' -print0 | xargs -0 shellcheck -x -P packaging

      - name: Actionlint workflow lint
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # Renovate owns ACTIONLINT_VERSION but cannot recompute the tarball
          # hash, so update ACTIONLINT_SHA256 in its PR (this check prints the
          # measured hash). rhysd/actionlint v1.7.12; sha256 of
          # actionlint_<version>_linux_amd64.tar.gz from the release checksums.
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          actual="$(sha256sum /tmp/actionlint.tar.gz | awk '{print $1}')"
          if [ "${actual}" != "${ACTIONLINT_SHA256}" ]
          then
            echo "::error::actionlint ${ACTIONLINT_VERSION} tarball hashes to ${actual}, not ${ACTIONLINT_SHA256}" >&2
            exit 1
          fi
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          cd "$(brew --repository "$TAP_REPO")"
          # No arguments: actionlint discovers .github/workflows/*.yml itself.
          /tmp/actionlint -color

      - name: Style and audit casks
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # The tap is already checked out by setup-homebrew. No --fix:
          # sandbox corrections are discarded and would mask regressions.
          brew style edgarcnp/tap
          tap_dir="$(brew --repository "$TAP_REPO")"
          for cask in "$tap_dir"/Casks/*.rb; do
            brew audit --cask "edgarcnp/tap/$(basename "$cask" .rb)"
          done

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
