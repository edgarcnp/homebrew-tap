name: AppImage build

# Reusable pipeline for one app. Everything app-specific comes from
# packaging/apps/<app>/app.json, so adding an app needs no workflow edit.

on:
  workflow_call:
    inputs:
      app:
        description: App id; a directory under packaging/apps holding app.json (e.g. vscode)
        required: true
        type: string

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

concurrency:
  group: appimage-build-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      app_id: ${{ steps.app.outputs.id }}
      app_name: ${{ steps.app.outputs.name }}
      app_cask: ${{ steps.app.outputs.cask }}
      asset_prefix: ${{ steps.app.outputs.asset_prefix }}
      tag_prefix: ${{ steps.app.outputs.tag_prefix }}
      needs_webkit: ${{ steps.app.outputs.needs_webkit }}
      architectures: ${{ steps.app.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.resolve.outputs.version }}
      skipped: ${{ steps.resolve.outputs.skipped }}
      repair_cask: ${{ steps.resolve.outputs.repair_cask }}
      source: ${{ steps.source.outputs.repo }}
      upstream_sha256_amd64: ${{ steps.resolve.outputs.upstream_sha256_amd64 }}
      upstream_sha256_arm64: ${{ steps.resolve.outputs.upstream_sha256_arm64 }}
      upstream_url_amd64: ${{ steps.resolve.outputs.upstream_url_amd64 }}
      upstream_url_arm64: ${{ steps.resolve.outputs.upstream_url_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Load app descriptor
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          # descriptor-env emits the pipeline's variables: uppercase to
          # $GITHUB_ENV, lowercase to $GITHUB_OUTPUT (which cannot read env).
          bun tap/packaging/bin/fbr.ts descriptor-env --app "${APP}" >> "${GITHUB_ENV}"
          bun tap/packaging/bin/fbr.ts descriptor-env --app "${APP}" --format output >> "${GITHUB_OUTPUT}"
      - name: Plan the build matrix
        id: matrix
        run: |
          # Single-arch apps build one AppImage, dual-arch both; the matrix
          # comes from the descriptor, so no workflow edit is needed.
          matrix="$(jq -c '{include: [.[] | select(. == "amd64" or . == "arm64") | if . == "amd64" then {architecture: ., runner: "ubuntu-latest", appimage_arch: "x86_64"} else {architecture: ., runner: "ubuntu-24.04-arm", appimage_arch: "aarch64"} end]}' <<<"${APP_ARCHITECTURES}")"
          [ "$(jq '.include | length' <<<"${matrix}")" -gt 0 ] || { echo "::error::no supported architectures in ${APP_ARCHITECTURES}" >&2; exit 1; }
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
      - name: Select source repository
        id: source
        run: |
          # Build from the upstream repository when it is reachable; otherwise
          # fall back to this owner's fork of it.
          upstream="${SOURCE_REPO}"
          if git ls-remote --exit-code "https://github.com/${upstream}.git" HEAD >/dev/null 2>&1; then
            echo "repo=${upstream}" >> "${GITHUB_OUTPUT}"
          else
            echo "repo=${SOURCE_OWNER}/${upstream#*/}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repo }}
          path: source
          persist-credentials: false
      - name: Resolve upstream version and gate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the apt resolver verifies a signed index with gpg.
          if [[ "$(bun source/packaging/bin/fbr.ts descriptor --app "${APP_ID}" --field oracle.kind)" == "apt" ]]; then
            sudo apt-get update
            sudo apt-get install -y gnupg
          fi
          cd source
          # The descriptor's watch feed and the oracle resolve asks publish on
          # their own schedules (opencode's update manifest lagged its own
          # release feed by ~1min on 2.0.14, and that run gated on the stale
          # read and skipped). Hold while the feed already advertises a version
          # the cask lacks and resolve has not moved past the cask, then gate
          # normally. Bounded: a feed that runs ahead cannot stall the job, and
          # it fails loudly instead of skipping a build nothing would retry.
          feed_version=""
          hold="false"
          for attempt in 1 2 3; do
            version=""
            upstream_sha256_amd64=""
            upstream_sha256_arm64=""
            upstream_url_amd64=""
            upstream_url_arm64=""
            while IFS= read -r arch; do
              [ -n "${arch}" ] || continue
              file="upstream/metadata-${arch}.json"
              bun packaging/bin/fbr.ts resolve \
                --app "${APP_ID}" --arch "${arch}" --metadata-only \
                --output-dir upstream --metadata "${file}"
              arch_version="$(jq -r '.version' "${file}")"
              if [ -z "${version}" ]; then
                version="${arch_version}"
              elif [ "${version}" != "${arch_version}" ]; then
                echo "upstream version mismatch: ${version} vs ${arch_version} (${arch})" >&2
                exit 1
              fi
              sha="$(jq -r '.sha256' "${file}")"
              url="$(jq -r '.repository + "/" + .repositoryPath' "${file}")"
              case "${arch}" in
                amd64)
                  upstream_sha256_amd64="${sha}"
                  upstream_url_amd64="${url}"
                  ;;
                arm64)
                  upstream_sha256_arm64="${sha}"
                  upstream_url_arm64="${url}"
                  ;;
                *) echo "unsupported architecture: ${arch}" >&2; exit 1 ;;
              esac
            done < <(jq -r '.[]' <<<"${APP_ARCHITECTURES}")
            [ -n "${version}" ] || { echo "no architectures resolved" >&2; exit 1; }
            [[ "${version}" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid upstream version: ${version}" >&2; exit 1; }
            version="${version//[^0-9A-Za-z._-]/_}"

            hold_rc=0
            hold_report="$(bun "${GITHUB_WORKSPACE}/tap/packaging/bin/fbr.ts" feed-hold \
              --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" \
              --upstream-version "${version}")" || hold_rc=$?
            if [ "${hold_rc}" -eq 2 ]; then
              # A usage error is our own bug: fail rather than gate blind.
              exit "${hold_rc}"
            elif [ "${hold_rc}" -ne 0 ]; then
              # The cross-check is advisory: a feed outage must not fail a run
              # that resolve is perfectly able to plan.
              echo "::warning::release feed unavailable (exit ${hold_rc}); gating without the feed cross-check" >&2
              hold="false"
              feed_version=""
            else
              feed_version="$(sed -n 's/^feed_version=//p' <<<"${hold_report}")"
              hold="$(sed -n 's/^hold=//p' <<<"${hold_report}")"
            fi
            [ "${hold}" = "true" ] || break
            if [ "${attempt}" -ge 3 ]; then
              echo "::error::${APP_ID}: the release feed advertises ${feed_version} but resolve still returns ${version}; re-dispatch this build once upstream publishes it" >&2
              exit 1
            fi
            echo "waiting for the ${APP_ID} oracle to publish ${feed_version} (hold ${attempt}/2)"
            sleep 60
          done
          cd "${GITHUB_WORKSPACE}"
          {
            echo "upstream_sha256_amd64=${upstream_sha256_amd64}"
            echo "upstream_sha256_arm64=${upstream_sha256_arm64}"
            echo "upstream_url_amd64=${upstream_url_amd64}"
            echo "upstream_url_arm64=${upstream_url_arm64}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

          # The gate decision is a unit-tested pure function; the rest of this
          # step gathers its inputs (cask pin, release existence, and whether
          # the published assets still match the cask pin).
          cask_json="$(bun tap/packaging/bin/fbr.ts cask --action read --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap")"
          cask_version="$(jq -r '.version' <<<"${cask_json}")"

          release_exists=false
          if gh release view "${TAG_PREFIX}${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_exists=true
          fi

          matches=""
          if [[ "${release_exists}" = "true" && "${cask_version}" = "${version}" ]]; then
            # release-check prints true|false, or nothing when it could not
            # compare (a shipped arch with no single asset).
            tmp_dir="$(mktemp -d)"
            if timeout 60 gh release download "${TAG_PREFIX}${version}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${ASSET_PREFIX}-*.AppImage" \
              --dir "${tmp_dir}" --clobber
            then
              matches="$(bun tap/packaging/bin/fbr.ts release-check \
                --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" --asset-dir "${tmp_dir}")"
            else
              echo "failed to download release ${TAG_PREFIX}${version}" >&2
            fi
            rm -rf -- "${tmp_dir}"
          fi

          if [[ "${release_exists}" = "true" && "${cask_version}" != "${version}" ]]; then
            # A queued duplicate run may have been queued against a stale
            # branch; re-read the cask from origin/main before deciding.
            if git -C tap fetch --quiet origin main; then
              git -C tap reset --hard --quiet FETCH_HEAD
              cask_version="$(bun tap/packaging/bin/fbr.ts cask --action read --app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" | jq -r '.version')"
            fi
          fi

          gate_args=(--app "${APP_ID}" --tap "${GITHUB_WORKSPACE}/tap" --upstream-version "${version}")
          if [[ "${release_exists}" = "true" ]]; then
            gate_args+=(--release-exists)
          fi
          if [[ -n "${matches}" ]]; then
            gate_args+=(--release-matches-cask "${matches}")
          fi
          bun tap/packaging/bin/fbr.ts gate "${gate_args[@]}" | tee -a "${GITHUB_OUTPUT}"

  build:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    # pkgforge's Arch container: sharun/quick-sharun bundle libc and everything
    # else from the build system, so the build OS must be Arch. Pinned by digest
    # (Renovate bumps tag and digest together).
    container:
      image: ghcr.io/pkgforge-dev/archlinux:v2026.09.05@sha256:b2507f1964270cab3cc190aa8df858521f6a7e45e969146a012877891d5dfc9b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.detect.outputs.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - name: Prepare Arch container
        run: |
          # setup-bun needs unzip (installed here); the rest is the toolchain
          # the pipeline shells out to.
          pacman-key --init
          pacman -Syy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            7zip \
            base-devel \
            curl \
            dpkg \
            git \
            gnupg \
            jq \
            nss \
            patchelf \
            unzip \
            wget \
            xorg-server-xvfb \
            zsync
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Load app descriptor
        env:
          APP: ${{ inputs.app }}
        run: |
          # The tap is the source of truth for the build flags.
          bun "${GITHUB_WORKSPACE}/tap/packaging/bin/fbr.ts" descriptor-env --app "${APP}" >> "${GITHUB_ENV}"
      - name: Install app build packages
        run: |
          # Build-time packages are per app (app.json buildPackages): only
          # libraries that must exist while packaging, e.g. one the app
          # dlopens and the descriptor names as a quick-sharun target.
          if [ -n "${BUILD_PACKAGES}" ]; then
            read -r -a packages <<<"${BUILD_PACKAGES}"
            pacman -S --noconfirm "${packages[@]}"
          fi
      - name: Install webkit2gtk build dependencies
        if: needs.detect.outputs.needs_webkit == 'true'
        run: |
          # webkit2gtk closure for the little-genius build; sharun bundles it.
          # Mirrors upstream webkit2gtk4-demo-appimage.sh: full webkit + gtk
          # for linking, X11 libs for strace-time dlopen detection.
          pacman -S --noconfirm \
            gdk-pixbuf2 \
            glib-networking \
            gtk3 \
            libxcb \
            libxcursor \
            libxi \
            libxkbcommon \
            libxkbcommon-x11 \
            libxrandr \
            libxtst \
            webkit2gtk-4.1
      - name: Install appimagetool
        run: |
          # Pinned pkgforge appimagetool (plain build). Renovate owns the version
          # and there is no local SHA-256 to move with it: pkgforge ships only
          # b3sum sidecars, which come from the same release as the binary, so a
          # sidecar check would add no trust over the HTTPS download itself.
          # quick-sharun invokes it via APPIMAGETOOL with no args (it reads the
          # APPDIR/OUT* env). Release downloads flake with transient 500s, so
          # retry a few times.
          attempt=1
          max_attempts=3
          until curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/appimagetool-uruntime \
            "https://github.com/pkgforge-dev/appimagetool/releases/download/0.5.2/appimagetool-${{ matrix.appimage_arch }}-linux" \
            && test -s /tmp/appimagetool-uruntime; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::appimagetool download failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "appimagetool download attempt ${attempt}/${max_attempts} failed; retrying in ${sleep_seconds}s..." >&2
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done
          chmod +x /tmp/appimagetool-uruntime
          mv /tmp/appimagetool-uruntime /opt/appimagetool-uruntime
      - name: Install Anylinux build tools
        run: |
          # quick-sharun + get-debloated-pkgs, pinned to a commit digest;
          # Renovate owns the pin (packaging/scripts/install-anylinux-tools.sh).
          # Raw release downloads flake with transient 500s, so retry a few
          # times (the installer retries each tool internally as well).
          attempt=1
          max_attempts=3
          until "${GITHUB_WORKSPACE}/tap/packaging/scripts/install-anylinux-tools.sh"; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::install-anylinux-tools failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "install-anylinux-tools attempt ${attempt}/${max_attempts} failed; retrying in ${sleep_seconds}s..." >&2
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done
      - name: Install debloated packages
        run: |
          # Debloated Arch packages shrink the AppImage; flags are per app.
          # The release downloads flake with transient 500s, so retry a few
          # times before failing (a manual re-run also clears it).
          read -r -a flags <<<"${DEBLOAT_ARGS}"
          attempt=1
          max_attempts=3
          until get-debloated-pkgs "${flags[@]}"; do
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::get-debloated-pkgs failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "get-debloated-pkgs attempt ${attempt}/${max_attempts} failed; retrying in ${sleep_seconds}s..." >&2
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done
      - name: Build AppImage
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          # quick-sharun drives appimagetool via env vars, not CLI args.
          APPIMAGETOOL: /opt/appimagetool-uruntime
          # brew owns updates: UPINFO="" keeps an update-info section out of the
          # artifact (quick-sharun would otherwise guess one from the repo).
          UPINFO: ""
        run: |
          cd source
          [ -z "${SOURCE_DIR}" ] || cd "${SOURCE_DIR}"
          bash -c "${BUILD_COMMAND}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.detect.outputs.asset_prefix }}-${{ matrix.appimage_arch }}
          path: source/dist/${{ needs.detect.outputs.asset_prefix }}-${{ needs.detect.outputs.version }}-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # Retention sorts tags with the pipeline's dpkg ordering, so it needs the
      # tap and the CLI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.detect.outputs.asset_prefix }}-*
          merge-multiple: true
          path: assets
      - name: Generate release notes
        env:
          UPSTREAM_SHA_AMD64: ${{ needs.detect.outputs.upstream_sha256_amd64 }}
          UPSTREAM_SHA_ARM64: ${{ needs.detect.outputs.upstream_sha256_arm64 }}
          UPSTREAM_URL_AMD64: ${{ needs.detect.outputs.upstream_url_amd64 }}
          UPSTREAM_URL_ARM64: ${{ needs.detect.outputs.upstream_url_arm64 }}
          APP_ID: ${{ needs.detect.outputs.app_id }}
        run: |
          # The table and prose come from a unit-tested command; only the
          # optional per-arch upstream rows are assembled here.
          upstream_args=(--upstream "amd64=${UPSTREAM_SHA_AMD64}=${UPSTREAM_URL_AMD64}")
          if [ -n "${UPSTREAM_SHA_ARM64}" ]; then
            upstream_args+=(--upstream "arm64=${UPSTREAM_SHA_ARM64}=${UPSTREAM_URL_ARM64}")
          fi
          bun tap/packaging/bin/fbr.ts release-notes \
            --app "${APP_ID}" \
            --asset-dir assets \
            "${upstream_args[@]}" \
            --output release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          APP_NAME: ${{ needs.detect.outputs.app_name }}
          ASSET_PREFIX: ${{ needs.detect.outputs.asset_prefix }}
        run: |
          TAG="${TAG_PREFIX}${PACKAGE_VERSION}"
          shopt -s nullglob
          appimages=(assets/"${ASSET_PREFIX}"-*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "::error::no AppImage artifacts matched assets/${ASSET_PREFIX}-*.AppImage" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${APP_NAME} ${PACKAGE_VERSION}" \
            --notes-file release-notes.md \
            "${appimages[@]}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/${{ needs.detect.outputs.asset_prefix }}-*.AppImage

      - name: Retain only the 3 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
        run: |
          # release-prune picks the stale versions by dpkg ordering (never
          # `sort -V`, which disagrees) and prints them oldest first, or nothing
          # when all are within the window. A failing gh call or unparseable tag
          # fails the step instead of pruning a short list.
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName')"
          mapfile -t tag_list <<< "${tags}"

          stale="$(bun tap/packaging/bin/fbr.ts release-prune \
            --prefix "${TAG_PREFIX}" --keep 3 "${tag_list[@]}")"
          if [ -z "${stale}" ]; then
            echo "retaining all releases; nothing stale"
            exit 0
          fi
          while IFS= read -r version
          do
            printf 'deleting release %s%s\n' "${TAG_PREFIX}" "${version}"
            gh release delete "${TAG_PREFIX}${version}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done <<< "${stale}"

  # Covers both gate outcomes: a fresh build (after publish) and a cask-only
  # repair (publish skipped). always() runs it when publish was skipped; the
  # build path still requires publish to succeed.
  pin-cask:
    needs: [detect, publish]
    if: >-
      always() && needs.detect.outputs.skipped == 'false' &&
      (needs.detect.outputs.repair_cask == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: push-casks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Pin cask to published release
        uses: ./.github/actions/update-cask
        with:
          app: ${{ needs.detect.outputs.app_id }}
          package_version: ${{ needs.detect.outputs.version }}
          tag_prefix: ${{ needs.detect.outputs.tag_prefix }}
          asset_prefix: ${{ needs.detect.outputs.asset_prefix }}
          token: ${{ secrets.HOMEBREW_PAT }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
