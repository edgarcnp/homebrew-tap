name: AppImage build

on:
  workflow_call:
    inputs:
      app_cask:
        description: Cask filename stem this pipeline updates (e.g. my-app)
        required: true
        type: string
      app_name:
        description: Human-readable app name used in the release title (e.g. My App)
        required: true
        type: string
      asset_prefix:
        description: Release asset filename prefix (e.g. my-app)
        required: true
        type: string
      tag_prefix:
        description: Release tag prefix, including trailing dash (e.g. my-app-v)
        required: true
        type: string
      source_owner:
        description: Owner of the fallback fork, used only when upstream_repo is unreachable (e.g. myorg)
        required: true
        type: string
      upstream_repo:
        description: Upstream packaging repository (owner/repo) to build from when available (e.g. myorg/my-app-linux)
        required: true
        type: string
      repository_url:
        description: >-
          Signed apt repository URL the app's .deb packages come from
          (e.g. https://packages.microsoft.com/repos/code); for resolve_kind
          github, the GitHub API repository base
          (e.g. https://api.github.com/repos/myorg/my-app)
        required: true
        type: string
      resolve_kind:
        description: >-
          Resolver backend; apt for signed apt repositories, github for
          GitHub release assets with sha256 asset digests
        required: false
        type: string
        default: apt
      key_path:
        description: Path to the pinned repository signing key (base64-encoded keyring) within the source checkout (e.g. assets/my-app-repository-key.gpg.base64)
        required: false
        type: string
        default: ""
      resolve_script:
        description: Path (relative to the source checkout root) of the upstream-linux-package.js resolver the detect job runs
        required: false
        type: string
        default: scripts/lib/upstream-linux-package.js
      resolve_args:
        description: Extra flags passed to the resolver (e.g. --package code --fingerprint <40 hex>); empty when the resolver hardcodes its package
        required: false
        type: string
        default: ""
      source_dir:
        description: Subdirectory of the source checkout holding the packaging scripts and assets; empty for the checkout root
        required: false
        type: string
        default: ""
      build_command:
        description: Shell command run in the source dir to produce dist/<asset_prefix>-<version>-<appimage_arch>.AppImage; env TARGET_ARCH (amd64|arm64) and PACKAGE_VERSION are set
        required: true
        type: string

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      skipped: ${{ steps.gate.outputs.skipped }}
      source: ${{ steps.source.outputs.repo }}
      upstream_sha256_amd64: ${{ steps.resolve.outputs.upstream_sha256_amd64 }}
      upstream_sha256_arm64: ${{ steps.resolve.outputs.upstream_sha256_arm64 }}
      upstream_url_amd64: ${{ steps.resolve.outputs.upstream_url_amd64 }}
      upstream_url_arm64: ${{ steps.resolve.outputs.upstream_url_arm64 }}
      cask_version: ${{ steps.gate.outputs.cask_version }}
      repair_cask: ${{ steps.gate.outputs.repair_cask }}
    steps:
      - name: Select source repository
        id: source
        env:
          SOURCE_REPO_OWNER: ${{ inputs.source_owner }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        run: |
          UPSTREAM_REPO_NAME="${UPSTREAM_REPO#*/}"
          if git ls-remote --exit-code "https://github.com/${UPSTREAM_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "repo=${UPSTREAM_REPO}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${SOURCE_REPO_OWNER}/${UPSTREAM_REPO_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.source.outputs.repo }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tap
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
      - name: Resolve upstream version
        id: resolve
        env:
          # resolve_args passes via env so input metacharacters can never be
          # interpolated into the script; apt callers use
          # --package <name> --fingerprint <40 hex>, github callers use
          # --asset-prefix <prefix>, each tokenized by read -ra
          RESOLVE_ARGS: ${{ inputs.resolve_args }}
          GH_TOKEN: ${{ github.token }}
          RESOLVE_KIND: ${{ inputs.resolve_kind }}
          KEY_PATH: ${{ inputs.key_path }}
          RESOLVE_SCRIPT: ${{ inputs.resolve_script }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
        run: |
          sudo apt-get update
          if [[ "${RESOLVE_KIND}" == "apt" ]]; then
            # only the apt resolver needs gnupg for InRelease verification
            sudo apt-get install -y gnupg
          fi
          cd source
          # shellcheck disable=SC2153 # RESOLVE_ARGS is injected via the step env block above
          read -ra resolve_args <<<"$RESOLVE_ARGS"
          key_args=()
          if [[ -n "${KEY_PATH}" ]]; then
            key_args+=(--key-base64 "${KEY_PATH}")
          fi
          node "${RESOLVE_SCRIPT}" \
            --metadata-only \
            --output-dir upstream \
            --metadata upstream/metadata.json \
            "${key_args[@]}" \
            --repository "${REPOSITORY_URL}" \
            "${resolve_args[@]}" \
            --arch amd64
          node "${RESOLVE_SCRIPT}" \
            --metadata-only \
            --output-dir upstream \
            --metadata upstream/metadata-arm64.json \
            "${key_args[@]}" \
            --repository "${REPOSITORY_URL}" \
            "${resolve_args[@]}" \
            --arch arm64
          amd64_metadata="upstream/metadata.json"
          arm64_metadata="upstream/metadata-arm64.json"
          version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$amd64_metadata")"
          arm64_version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$arm64_metadata")"
          [ "$version" = "$arm64_version" ] || { echo "amd64/arm64 upstream version mismatch" >&2; exit 1; }
          [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid upstream version: $version" >&2; exit 1; }
          version="${version//[^0-9A-Za-z._-]/_}"
          {
            echo "upstream_sha256_amd64=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sha256' "$amd64_metadata")"
            echo "upstream_sha256_arm64=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).sha256' "$arm64_metadata")"
            echo "upstream_url_amd64=$(node -p 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); m.repository + "/" + m.repositoryPath' "$amd64_metadata")"
            echo "upstream_url_arm64=$(node -p 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); m.repository + "/" + m.repositoryPath' "$arm64_metadata")"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
      - name: Gate on upstream version vs cask version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          APP_CASK: ${{ inputs.app_cask }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          ASSET_PREFIX: ${{ inputs.asset_prefix }}
        run: |
          # Download the release assets for TAG_PREFIX$version and compare
          # their SHA-256 against the cask's pinned values. A rebuilt release
          # (DWARFS images are not byte-reproducible) can change checksums
          # without a version bump; detect that so the cask is caught up to
          # the actual assets instead of silently skipping.
          verify_release_assets() {
            local version="$1"
            local tmp_dir
            tmp_dir="$(mktemp -d)"

            local nullglob_state
            nullglob_state="$(shopt -p nullglob)"

            local ok="false"
            local cask_x86_64 cask_arm64
            cask_x86_64="$(sed -n 's/^.*x86_64_linux:[[:space:]]*"\([0-9a-f]\{64\}\)".*$/\1/p' "tap/Casks/${APP_CASK}.rb" | head -n1)"
            cask_arm64="$(sed -n 's/^.*arm64_linux:[[:space:]]*"\([0-9a-f]\{64\}\)".*$/\1/p' "tap/Casks/${APP_CASK}.rb" | head -n1)"
            if [[ -z "${cask_x86_64}" || -z "${cask_arm64}" ]]; then
              echo "could not parse pinned checksums from tap/Casks/${APP_CASK}.rb" >&2
            elif timeout 60 gh release download "${TAG_PREFIX}${version}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${ASSET_PREFIX}-*-x86_64.AppImage" \
              --pattern "${ASSET_PREFIX}-*-aarch64.AppImage" \
              --dir "${tmp_dir}" --clobber
            then
              shopt -s nullglob
              local x86_files arm_files
              x86_files=("${tmp_dir}"/"${ASSET_PREFIX}"-*-x86_64.AppImage)
              arm_files=("${tmp_dir}"/"${ASSET_PREFIX}"-*-aarch64.AppImage)
              if [[ "${#x86_files[@]}" -ne 1 || "${#arm_files[@]}" -ne 1 ]]; then
                echo "expected exactly one asset per architecture in release ${TAG_PREFIX}${version}" >&2
              else
                local released_x86_64 released_arm64
                released_x86_64="$(sha256sum "${x86_files[0]}" | awk '{print $1}')"
                released_arm64="$(sha256sum "${arm_files[0]}" | awk '{print $1}')"
                if [[ "${released_x86_64}" = "${cask_x86_64}" && "${released_arm64}" = "${cask_arm64}" ]]; then
                  echo "release assets match cask checksums"
                  ok="true"
                else
                  echo "release assets differ from cask checksums:" >&2
                  echo "  x86_64: cask ${cask_x86_64} vs release ${released_x86_64}" >&2
                  echo "  arm64:  cask ${cask_arm64} vs release ${released_arm64}" >&2
                fi
              fi
            else
              echo "failed to download release ${TAG_PREFIX}${version}" >&2
            fi

            rm -rf -- "${tmp_dir}"
            eval "${nullglob_state}"
            if [[ "${ok}" = "true" ]]; then
              return 0
            fi
            return 1
          }
          cask_version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' "tap/Casks/${APP_CASK}.rb" | head -n1)"
          version="${{ steps.resolve.outputs.version }}"
          newer="false"
          case "$cask_version" in
            ''|[!0-9]*)
              newer="true" ;;
            *)
              if printf '%s\n%s\n' "$cask_version" "$version" | sort -V -C; then
                if [ "$cask_version" != "$version" ]; then
                  newer="true"
                fi
              fi ;;
          esac
          release_exists="false"
          if gh release view "${TAG_PREFIX}${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists="true"
          fi
          skipped="false"
          repair="false"
          if [ "$newer" = "true" ]; then
            if [ "$release_exists" = "true" ]; then
              echo "Upstream ${version} is newer than cask ${cask_version}; release already published, catching cask up"
              repair="true"
            else
              echo "Upstream ${version} is newer than cask ${cask_version}; building"
            fi
          else
            if [ "$release_exists" = "true" ]; then
              if [ "$cask_version" = "$version" ]; then
                if verify_release_assets "$version"; then
                  echo "Cask ${cask_version} already at upstream ${version}; skipping"
                  skipped="true"
                else
                  echo "Cask ${cask_version} at upstream version but release assets differ; catching cask up"
                  repair="true"
                fi
              else
                echo "Cask ${cask_version} is ahead of upstream ${version}; skipping"
                skipped="true"
              fi
            else
              echo "Cask ${cask_version} references a version with no release; (re)building"
            fi
          fi
          {
            echo "cask_version=${cask_version}"
            echo "newer=${newer}"
            echo "release_exists=${release_exists}"
            echo "repair_cask=${repair}"
            echo "skipped=${skipped}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            appimage_arch: x86_64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.detect.outputs.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tap
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg rpm
          # webkit2gtk runtime closure for the gitbutler AppImage build
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgdk-pixbuf2.0-bin glib-networking
      - name: Install appimagetool
        run: |
          # pinned release, verified against its own BLAKE3 checksum;
          # verifier: blake3 PyPI package; renovate bumps the version
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/appimagetool-uruntime \
            "https://github.com/pkgforge-dev/appimagetool/releases/download/0.3.3/appimagetool-${{ matrix.appimage_arch }}-linux"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/appimagetool-uruntime.b3sum \
            "https://github.com/pkgforge-dev/appimagetool/releases/download/0.3.3/appimagetool-${{ matrix.appimage_arch }}-linux.b3sum"
          test -s /tmp/appimagetool-uruntime
          test -s /tmp/appimagetool-uruntime.b3sum
          python3 -m pip --version >/dev/null 2>&1 || sudo apt-get install -y python3-pip
          python3 -m pip install --quiet --user "blake3==1.0.9"
          python3 - <<'PYEOF'
          import blake3, pathlib, sys

          binary = pathlib.Path("/tmp/appimagetool-uruntime").read_bytes()
          expected = pathlib.Path("/tmp/appimagetool-uruntime.b3sum").read_text().split()[0]
          got = blake3.blake3(binary).hexdigest()
          if got != expected:
              print(f"BLAKE3 mismatch: got {got}, expected {expected}", file=sys.stderr)
              sys.exit(1)
          print("BLAKE3 verified")
          PYEOF
          chmod +x /tmp/appimagetool-uruntime
          sudo mv /tmp/appimagetool-uruntime /opt/appimagetool-uruntime
          sudo cp "${GITHUB_WORKSPACE}/tap/packaging/scripts/appimagetool-uruntime.sh" /usr/local/bin/appimagetool
          sudo chmod 0755 /usr/local/bin/appimagetool
      - name: Install linuxdeploy
        run: |
          # pinned continuous build (last-modified 2026-08-01), verified via SHA256;
          # hashes captured 2026-08-26 for the "continuous" tag (no versioned
          # releases for current builds), so we pin by SHA256 instead of tag.
          # Renovate should bump the hashes via renovate.json customManagers.
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage"
          test -s /tmp/linuxdeploy
          case "${{ matrix.appimage_arch }}" in
            x86_64) expected="421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e" ;;
            aarch64) expected="9f04c4c2a8b69c392c4bbcc1a88bdd4d0a8ac03f587cf5242814cb7ae47b78e5" ;;
            *) echo "Unknown appimage_arch: ${{ matrix.appimage_arch }}" >&2; exit 1 ;;
          esac
          actual="$(sha256sum /tmp/linuxdeploy | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "SHA256 mismatch for linuxdeploy (${{ matrix.appimage_arch }}): expected $expected, got $actual" >&2
            exit 1
          fi
          echo "SHA256 verified for linuxdeploy (${{ matrix.appimage_arch }}): $actual"
          chmod +x /tmp/linuxdeploy
          sudo mv /tmp/linuxdeploy /opt/linuxdeploy
          sudo ln -sf /opt/linuxdeploy /usr/local/bin/linuxdeploy
      - name: Build AppImage
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          SOURCE_DIR: ${{ inputs.source_dir }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          cd source
          [ -z "${SOURCE_DIR}" ] || cd "${SOURCE_DIR}"
          bash -c "$BUILD_COMMAND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.asset_prefix }}-${{ matrix.appimage_arch }}
          path: source/dist/${{ inputs.asset_prefix }}-${{ needs.detect.outputs.version }}-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.asset_prefix }}-*
          merge-multiple: true
          path: assets
      - name: Generate release notes
        id: notes
        env:
          UPSTREAM_SHA_AMD64: ${{ needs.detect.outputs.upstream_sha256_amd64 }}
          UPSTREAM_SHA_ARM64: ${{ needs.detect.outputs.upstream_sha256_arm64 }}
          UPSTREAM_URL_AMD64: ${{ needs.detect.outputs.upstream_url_amd64 }}
          UPSTREAM_URL_ARM64: ${{ needs.detect.outputs.upstream_url_arm64 }}
          APP_CASK: ${{ inputs.app_cask }}
          ASSET_PREFIX: ${{ inputs.asset_prefix }}
        run: |
          # shellcheck disable=SC2016 # printf format strings and GitHub Actions templates are intentional
          {
            printf '%s\n\n' '## Artifact checksums'
            printf 'Upstream `.deb` integrity is verified against the release source (signed APT index or download-time SHA-256) before packaging; the AppImage hashes are enforced by the `%s` cask at install.\n' "${APP_CASK}"
            printf '\n'
            printf '%s\n' '| Artifact | SHA-256 |'
            printf '%s\n' '| --- | --- |'
            printf '| Upstream `.deb` (amd64) | `%s` |\n' "${UPSTREAM_SHA_AMD64:-n/a}"
            printf '| Upstream `.deb` (arm64) | `%s` |\n' "${UPSTREAM_SHA_ARM64:-n/a}"
            for file in assets/"${ASSET_PREFIX}"-*.AppImage; do
              [ -e "$file" ] || continue
              arch="${file##*-}"
              arch="${arch%.AppImage}"
              printf '| AppImage (%s) | `%s` |\n' "$arch" "$(sha256sum "$file" | awk '{print $1}')"
            done
            printf '\n'
            printf '%s\n' '### Sources'
            printf -- '- Upstream `.deb` (amd64): %s\n' "$UPSTREAM_URL_AMD64"
            printf -- '- Upstream `.deb` (arm64): %s\n' "$UPSTREAM_URL_ARM64"
          } > release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag_prefix }}${{ needs.detect.outputs.version }}
          name: ${{ inputs.app_name }} ${{ needs.detect.outputs.version }}
          body_path: release-notes.md
          files: assets/${{ inputs.asset_prefix }}-*.AppImage
          fail_on_unmatched_files: true

      - name: Retain only the 3 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          matches="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep "^${TAG_PREFIX}" | sort -V || true)"
          if [[ -z "$matches" ]]; then
            exit 0
          fi
          mapfile -t tags <<< "$matches"
          if [ "${#tags[@]}" -le 3 ]; then
            exit 0
          fi
          stale=("${tags[@]:0:$((${#tags[@]} - 3))}")
          printf 'retaining %s release(s); deleting %s stale release(s)\n' "${#tags[@]}" "${#stale[@]}"
          for tag in "${stale[@]}"; do
            echo "deleting release ${tag}"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

  update-cask:
    needs: [detect, publish]
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: push-casks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Update cask version and checksums
        env:
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          ASSET_PREFIX: ${{ inputs.asset_prefix }}
          APP_CASK: ${{ inputs.app_cask }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid version: $PACKAGE_VERSION" >&2; exit 1; }
          # hash the released assets, not the run artifacts, so the cask
          # always matches what the release actually hosts
          gh release download "${TAG_PREFIX}${PACKAGE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${ASSET_PREFIX}-*-x86_64.AppImage" \
            --pattern "${ASSET_PREFIX}-*-aarch64.AppImage" \
            --dir assets --clobber
          x86_64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-x86_64.AppImage | awk '{print $1}')"
          arm64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-aarch64.AppImage | awk '{print $1}')"
          python3 - "$PACKAGE_VERSION" "$x86_64_sha" "$arm64_sha" <<'PY'
          import os
          import re
          import sys

          version, x64, arm = sys.argv[1], sys.argv[2], sys.argv[3]
          path = f"Casks/{os.environ['APP_CASK']}.rb"
          text = open(path, encoding="utf-8").read()
          text, n = re.subn(r'^(\s*)version "[^"]*"', rf'\1version "{version}"', text, count=1, flags=re.M)
          if n != 1:
              print(f"no cask version pattern found in {path}", file=sys.stderr)
              sys.exit(1)
          text, n = re.subn(r'(x86_64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{x64}\g<2>", text, count=1)
          if n != 1:
              print(f"no x86_64_linux sha256 pattern found in {path}", file=sys.stderr)
              sys.exit(1)
          text, n = re.subn(r'(arm64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{arm}\g<2>", text, count=1)
          if n != 1:
              print(f"no arm64_linux sha256 pattern found in {path}", file=sys.stderr)
              sys.exit(1)
          open(path, "w", encoding="utf-8").write(text)
          PY
      - name: Commit and push cask update
        env:
          GH_TOKEN: ${{ github.token }}
          APP_CASK: ${{ inputs.app_cask }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # no author/committer fields: the token identity (github-actions[bot])
          # becomes author/committer and GitHub auto-signs the commit
          base="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          for _ in 1 2 3 4 5; do
            blob="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" \
              -F encoding=utf-8 -F content=@"Casks/${APP_CASK}.rb" --jq .sha)"
            base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$base" --jq .tree.sha)"
            tree="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" \
              -f base_tree="$base_tree" \
              -f "tree[][path]=Casks/${APP_CASK}.rb" \
              -f "tree[][mode]=100644" \
              -f "tree[][type]=blob" \
              -f "tree[][sha]=$blob" \
              --jq .sha)"
            commit="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" \
              -f message="chore(cask): update ${APP_CASK} to ${PACKAGE_VERSION}" \
              -f tree="$tree" -f "parents[]=$base" --jq .sha)"
            if gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
              -f sha="$commit" --silent; then
              echo "pushed cask update ${commit}"
              exit 0
            fi
            # concurrent runs may advance the branch between read and write;
            # rebase onto the new head and retry (422 fast-forward rejection)
            sleep 10
            base="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          done
          echo "could not push cask update after 5 attempts" >&2
          exit 1

  repair-cask:
    needs: detect
    if: needs.detect.outputs.skipped == 'false' && needs.detect.outputs.repair_cask == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: push-casks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Catch cask up to existing release
        env:
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          ASSET_PREFIX: ${{ inputs.asset_prefix }}
          APP_CASK: ${{ inputs.app_cask }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "invalid version: $PACKAGE_VERSION" >&2; exit 1; }
          gh release download "${TAG_PREFIX}${PACKAGE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${ASSET_PREFIX}-*-x86_64.AppImage" \
            --pattern "${ASSET_PREFIX}-*-aarch64.AppImage" \
            --dir assets --clobber
          x86_64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-x86_64.AppImage | awk '{print $1}')"
          arm64_sha="$(sha256sum assets/"${ASSET_PREFIX}"-*-aarch64.AppImage | awk '{print $1}')"
          python3 - "$PACKAGE_VERSION" "$x86_64_sha" "$arm64_sha" <<'PY'
          import os
          import re
          import sys

          version, x64, arm = sys.argv[1], sys.argv[2], sys.argv[3]
          path = f"Casks/{os.environ['APP_CASK']}.rb"
          text = open(path, encoding="utf-8").read()
          text, n = re.subn(r'^(\s*)version "[^"]*"', rf'\1version "{version}"', text, count=1, flags=re.M)
          if n != 1:
              print(f"no cask version pattern found in {path}", file=sys.stderr)
              sys.exit(1)
          text, n = re.subn(r'(x86_64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{x64}\g<2>", text, count=1)
          if n != 1:
              print(f"no x86_64_linux sha256 pattern found in {path}", file=sys.stderr)
              sys.exit(1)
          text, n = re.subn(r'(arm64_linux:\s*")[0-9a-f]{64}(")', rf"\g<1>{arm}\g<2>", text, count=1)
          if n != 1:
              print(f"no arm64_linux sha256 pattern found in {path}", file=sys.stderr)
              sys.exit(1)
          open(path, "w", encoding="utf-8").write(text)
          PY
      - name: Commit and push cask update
        env:
          GH_TOKEN: ${{ github.token }}
          APP_CASK: ${{ inputs.app_cask }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # no author/committer fields: the token identity (github-actions[bot])
          # becomes author/committer and GitHub auto-signs the commit
          base="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          for _ in 1 2 3 4 5; do
            blob="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" \
              -F encoding=utf-8 -F content=@"Casks/${APP_CASK}.rb" --jq .sha)"
            base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$base" --jq .tree.sha)"
            tree="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" \
              -f base_tree="$base_tree" \
              -f "tree[][path]=Casks/${APP_CASK}.rb" \
              -f "tree[][mode]=100644" \
              -f "tree[][type]=blob" \
              -f "tree[][sha]=$blob" \
              --jq .sha)"
            commit="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" \
              -f message="chore(cask): update ${APP_CASK} to ${PACKAGE_VERSION}" \
              -f tree="$tree" -f "parents[]=$base" --jq .sha)"
            if gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
              -f sha="$commit" --silent; then
              echo "pushed cask update ${commit}"
              exit 0
            fi
            # concurrent runs may advance the branch between read and write;
            # rebase onto the new head and retry (422 fast-forward rejection)
            sleep 10
            base="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          done
          echo "could not push cask update after 5 attempts" >&2
          exit 1
