# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/workflows/**"
      - "packaging/**"
      - "renovate.json"
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/workflows/**"
      - "packaging/**"
      - "renovate.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # macOS: all casks are Linux-only (depends_on :linux); the Ubuntu
        # container leg below runs shellcheck, actionlint, brew style/audit
        # and the test-bot tap-syntax check.
        # os: [ macos-26 ]
        include:
          - container:
              image: ghcr.io/homebrew/brew:main@sha256:ae15a6ca4bd9079c89054e1adab6f076cb062db640df166a40a538ea99a1e5cc
              options: --privileged
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Shellcheck packaging scripts
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            apt-get update
            apt-get install -y shellcheck
          fi
          # in the brew container the tap checkout lives in the tap
          # directory, not under GITHUB_WORKSPACE
          cd "$(brew --repository "$TAP_REPO")"
          shellcheck packaging/scripts/*.sh packaging/lib/*.sh packaging/vscode/scripts/*.sh packaging/opencode/scripts/*.sh packaging/gitbutler/scripts/*.sh
          for apprun in packaging/vscode/templates/AppRun packaging/opencode/templates/AppRun packaging/gitbutler/templates/AppRun; do
            if grep -q '^#!' "$apprun"; then
              shellcheck "$apprun"
            else
              echo "$apprun has no shebang; skipping shellcheck" >&2
            fi
          done

      - name: Actionlint workflow lint
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # pinned actionlint version - update ACTIONLINT_VERSION and ACTIONLINT_SHA256 together
          # rhysd/actionlint v1.7.8
          ACTIONLINT_VERSION="1.7.8"
          ACTIONLINT_SHA256="be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          cd "$(brew --repository "$TAP_REPO")"
          /tmp/actionlint -color .github/workflows/build-appimage.yml .github/workflows/build-vscode.yml .github/workflows/build-gitbutler.yml .github/workflows/build-opencode-desktop.yml .github/workflows/cask-smoke.yml .github/workflows/tests.yml .github/workflows/autobump.yml .github/workflows/publish.yml

      - name: Style and audit casks
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # the tap is already checked out by setup-homebrew
          # no --fix: corrections in the sandbox are discarded, so they would
          # mask style regressions instead of failing the run
          brew style edgarcnp/tap
          tap_dir="$(brew --repository "$TAP_REPO")"
          for cask in "$tap_dir"/Casks/*.rb; do
            brew audit --cask "edgarcnp/tap/$(basename "$cask" .rb)"
          done

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
