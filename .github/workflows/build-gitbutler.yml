name: Build and publish GitButler AppImage

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: gitbutler-build
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build-appimage.yml
    with:
      app_cask: gitbutler
      app_name: GitButler
      asset_prefix: gitbutler
      tag_prefix: gitbutler-v
      source_owner: edgarcnp
      # upstream_repo selects the tap's own releases, so the shared workflow's
      # "select source repository" fallback (source_owner) is a no-op here.
      upstream_repo: edgarcnp/homebrew-tap
      # GitButler publishes no signed apt repository, so no key_path is
      # passed; the resolver ignores any --key-base64 flag anyway.
      repository_url: https://app.gitbutler.com/downloads/release/linux
      resolve_script: packaging/gitbutler/scripts/resolve-gitbutler.js
      resolve_args: ""
      source_dir: packaging/gitbutler
      build_command: ./scripts/build-appimage.sh
