name: Dispatch build

# Entry point for programmatic builds: a workflow_dispatch run names the app
# to build by app id or cask token (or "all"). It is the API's path — it
# returns a run id (return_run_details), so the caller polls this one run.
# Routing lives in the build workflow's plan job, so an unknown or missing app
# fails loudly instead of matching no job at all.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App id or cask token to build, or "all"
        required: true
        type: string
      version:
        description: Informational; the pipeline resolves the upstream version itself
        required: false
        type: string
      trigger_repo:
        description: Informational; the repo requesting the build
        required: false
        type: string
      request_id:
        description: The API's correlation id for the dispatch requesting this run
        required: false
        type: string

permissions: {}

jobs:
  build:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      app: ${{ github.event.inputs.app }}
      request_id: ${{ github.event.inputs.request_id }}
