# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/**"
      - "packaging/**"
      - "package.json"
      - "tsconfig.json"
      - "renovate.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # macOS: all casks are Linux-only (depends_on :linux); the Ubuntu
        # container leg below runs shellcheck, actionlint, the TypeScript
        # typecheck and unit tests, brew style/audit and the test-bot
        # tap-syntax check.
        # os: [ macos-26 ]
        include:
          - container:
              image: ghcr.io/homebrew/brew:latest@sha256:613f2f524c4d1fb8fe37dbe7a5581392c89e7865bac725bab0d8e24309ae6d7c
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    container:
      image: ${{ fromJSON(toJSON(matrix.container)).image }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Homebrew Bundler RubyGems
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Save Homebrew Bundler RubyGems
        # PR runs only restore the cache; saving is skipped so fork-PR runs
        # can never write attacker-injected Ruby into a shared cache entry
        # that main-branch runs would later restore (cache poisoning).
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install packaging dev dependencies
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # in the brew container the tap checkout lives in the tap
          # directory, not under GITHUB_WORKSPACE
          cd "$(brew --repository "$TAP_REPO")"
          npm ci --ignore-scripts

      - name: Typecheck the packaging toolchain
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          cd "$(brew --repository "$TAP_REPO")"
          npm run typecheck

      - name: Unit-test the packaging toolchain
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          cd "$(brew --repository "$TAP_REPO")"
          npm test

      - name: Check casks against their app descriptors
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # one parser for Casks/*.rb, shared with the publish pipeline; it
          # fails when a cask drifts from packaging/apps/<app>/app.json
          cd "$(brew --repository "$TAP_REPO")"
          node packaging/bin/fbr.ts cask --action check

      - name: Shellcheck packaging scripts
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          else
            apt-get update
            apt-get install -y shellcheck
          fi
          cd "$(brew --repository "$TAP_REPO")"
          # globbed, so a new script is linted without editing this file; -x
          # follows the sourced pipeline libraries
          find packaging -name '*.sh' -print0 | xargs -0 shellcheck -x -P packaging

      - name: Actionlint workflow lint
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # pinned actionlint version - update ACTIONLINT_VERSION and ACTIONLINT_SHA256 together
          # rhysd/actionlint v1.7.8
          ACTIONLINT_VERSION="1.7.8"
          ACTIONLINT_SHA256="be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tar.gz actionlint
          cd "$(brew --repository "$TAP_REPO")"
          # no arguments: actionlint discovers .github/workflows/*.yml itself,
          # so a new workflow is covered without editing this file
          /tmp/actionlint -color

      - name: Style and audit casks
        env:
          TAP_REPO: ${{ github.repository }}
        run: |
          # the tap is already checked out by setup-homebrew
          # no --fix: corrections in the sandbox are discarded, so they would
          # mask style regressions instead of failing the run
          brew style edgarcnp/tap
          tap_dir="$(brew --repository "$TAP_REPO")"
          for cask in "$tap_dir"/Casks/*.rb; do
            brew audit --cask "edgarcnp/tap/$(basename "$cask" .rb)"
          done

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
